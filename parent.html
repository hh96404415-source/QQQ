<script>
/* ── 家長入口：用「家庭家長 PIN」登入，回傳這個家庭的孩子名單 ──
   不再依賴「這台裝置剛好有小孩登入」，也不在本機自設 PIN。 */
(function(){
  var GAS_URL='https://script.google.com/macros/s/AKfycbydbycnfQsKkirktxFhKOB9p847SlW3e7Jd8oudLykEgkh_zp4ATPde4XIc476JcWNl/exec';
  var KEY='dsh_parent_sess', DAY=86400000;
  var lock=document.getElementById('lock'), pad=document.getElementById('lockPad');
  var dots=[].slice.call(document.querySelectorAll('#lockDots i'));
  var err=document.getElementById('lockErr'), hint=document.getElementById('lockHint');
  var skip=document.getElementById('lockSkip');
  var buf='', busy=false;

  window.PARENT_RESULT=null;
  window.PARENT_ON_LOGIN=null;

  function sess(){
    try{
      var o=JSON.parse(localStorage.getItem(KEY)||'null');
      return (o&&o.id&&(Date.now()-(o.t||0))<30*DAY)?o:null;
    }catch(e){ return null; }
  }
  function saveSess(f){
    try{ localStorage.setItem(KEY, JSON.stringify({id:f.id, name:f.name||'', session:f.session||'', t:Date.now()})); }catch(e){}
  }
  function paint(){ dots.forEach(function(d,i){ d.className=i<buf.length?'on':''; }); }
  function show(){
    hint.textContent='輸入這個家庭的家長 PIN（8 位）';
    if(skip) skip.style.display='none';
    err.textContent=''; buf=''; paint(); busy=false;
    lock.classList.add('on');
  }
  function post(body, cb){
    fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body),
      redirect:'follow'
    }).then(function(r){ return r.json(); }).then(function(d){ cb(null,d); })
      .catch(function(e){ cb(e,null); });
  }
  function done(){
    if(busy) return;
    busy=true; err.textContent=''; hint.textContent='驗證中…';
    post({action:'parentLogin', pin:buf}, function(er,d){
      if(er||!d||!d.ok){
        // 不是家長 PIN → 試開發者 PIN（GAS devOverview 只在 PIN 對時回 ok）
        post({action:'devOverview', dev_pin:buf}, function(er2,d2){
          busy=false;
          if(er2||!d2||!d2.ok){
            buf=''; paint();
            hint.textContent='輸入這個家庭的家長 PIN（8 位）';
            err.textContent=(d&&d.error)||(er&&String(er))||'PIN 不對';
            return;
          }
          try{ sessionStorage.setItem('dsh_dev_pin',buf); sessionStorage.setItem('dsh_dev_ok','1'); }catch(e){}
          location.href='dev.html';
        });
        return;
      }
      saveSess(d.family||{});
      window.PARENT_RESULT=d;
      lock.classList.remove('on');
      if(window.PARENT_ON_LOGIN) window.PARENT_ON_LOGIN(d);
    });
  }
  ['1','2','3','4','5','6','7','8','9','←','0',''].forEach(function(k){
    var b=document.createElement('button');
    b.textContent=k; b.disabled=(k==='');
    b.addEventListener('click',function(){
      if(busy) return;
      if(k==='←'){ buf=buf.slice(0,-1); paint(); return; }
      if(buf.length>=8) return;
      buf+=k; paint();
      if(buf.length===8){
        setTimeout(done,120);
      }
    });
    pad.appendChild(b);
  });
  if(skip) skip.addEventListener('click',function(){ lock.classList.remove('on'); });

  var s=sess();
  if(s){ window.PARENT_RESULT={ok:true, family:{id:s.id,name:s.name}, users:[]}; }
  else show();
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   1. 文案（直接沿用 GAS-Code.gs 的 SKILL_NAME / ACT / tagOf_ / verdictOf_）
   ══════════════════════════════════════════════════════════════ */
var SKILL_NAME = {
  'M.ADD': '加法', 'M.SUB': '減法', 'M.COMP': '比較大小', 'M.WORD': '應用題',
  'M.MUL': '乘法', 'M.DIV': '除法',
  'C.MW': '量詞', 'C.SENT': '句子', 'C.FORM': '部首字形', 'C.VOCAB': '詞彙',
  'E.VOCAB': '英文詞彙', 'E.SENT': '英文短句', 'E.LETTER': '英文字母', 'E.SPELL': '英文串字',
  'C.WRITE': '寫字（筆順）'
};

var ACT = {
  'M.ADD': { why: '加數係之後所有數學嘅地基，唔熟就會一路卡。',
    do: '用 10 粒豆做 5 題「8 加 5」：先講「8 加 2 夠 10」，再數剩低 3 粒。',
    ok: '做到 3 題唔使數手指。' },
  'M.SUB': { why: '減數要借位，係小二最容易斷嘅一環。',
    do: '用 10 粒豆做 5 題「15 減 7」：先拿走 5 粒到 10，再拿走 2 粒。',
    ok: '佢講得出「我拿走咗幾多」。' },
  'M.COMP': { why: '比較大小係應用題嘅前置。',
    do: '寫 5 對數字（例如 47 同 74），叫佢圈大嗰個，再講「點解」。',
    ok: '5 對圈中 4 對。' },
  'M.WORD': { why: '應用題要「讀得明」先「算得到」。',
    do: '讀 3 題應用題，每題叫佢畫圖畫出「有幾多、發生咩事」，唔使計答案。',
    ok: '畫到圖，講得出件事。' },
  /* 乘除係本頁額外補嘅（GAS 原本 12 個技能冇），只會喺真係玩過先出現 */
  'M.MUL': { why: '乘數要由「幾個幾」開始，硬背乘數表會唔明。',
    do: '用 3 排 x 4 粒豆，問「總共幾多」，先數一排再一齊數。',
    ok: '講得出「4 個 3 係 12」。' },
  'M.DIV': { why: '除數係乘數嘅倒轉，唔熟乘數就會卡。',
    do: '12 粒豆平均分 3 碟，問「每碟幾多」，再問「點知」。',
    ok: '分完講得出每碟 4 粒。' },
  'C.MW': { why: '量詞錯，句子聽落就唔自然，影響寫作同自信。',
    do: '喺屋企搵 10 樣嘢，一人講「一 ___ 」，講錯就交換。',
    ok: '10 樣中 8 樣啱。' },
  'C.SENT': { why: '句子結構係理解同作文嘅骨架。',
    do: '揀 3 句課文句子，讀 3 次，遮住再講返出嚟。',
    ok: '3 句講返到 2 句。' },
  'C.FORM': { why: '部首同字形係認字嘅鎖匙，識咗就唔使死記。',
    do: '寫 5 個字，逐個圈部首，講「呢個字同咩有關」。',
    ok: '5 個圈中 4 個。' },
  'C.VOCAB': { why: '詞彙量直接決定佢聽唔聽得明題目。',
    do: '做 5 張字卡：正面字、背面圖或動作，每日 3 分鐘。',
    ok: '5 張認到 4 張。' },
  'E.VOCAB': { why: '英文詞彙係 listening 同 reading 嘅底。',
    do: '指住屋企 10 樣嘢（門、窗、雪櫃）講英文，一日 2 次。',
    ok: '10 樣講到 7 樣。' },
  'E.SENT': { why: '短句係由「識字」去「講到」嘅橋。',
    do: '揀 3 句短句，你讀一次、佢讀一次，每人 3 次。',
    ok: '3 句讀到 2 句順。' },
  'E.LETTER': { why: '字母唔熟，串字同拼讀都會慢。',
    do: '字母卡 A 至 Z，抽 10 張認名兼認音，錯嘅放埋一邊再抽。',
    ok: '10 張認到 8 張。' },
  'E.SPELL': { why: '串字係英文寫作同默書嘅第一步。',
    do: '揀 5 個三字母字（cat / dog / bus），用字母磚砌，砌完讀一次。',
    ok: '5 個砌到 4 個。' },
  'C.WRITE': { why: '筆順錯，寫字慢又容易寫錯，之後抄寫同默書都會蝕底。',
    do: '揀 3 個今個星期寫過嘅字，叫佢用手指喺半空寫一次出聲數筆畫，再寫落紙。',
    ok: '3 個字都寫得順、筆畫數得出。' }
};

var ACT_SUBJ = {
  Math: { why: '數學基礎要逐格補。', do: '用實物做 5 題，邊做邊講出聲。', ok: '5 題做到 4 題。' },
  Chinese: { why: '中文要由認字同句子入手。', do: '讀 3 句、寫 5 個字，逐個講意思。', ok: '讀到同寫到大部分。' },
  English: { why: '英文要由聽同講入手。', do: '每日 5 分鐘：指物講英文、跟讀 3 句。', ok: '講到七成。' }
};

function tagOf_(rate, sec, n) {
  if (!n) return '未有數據';
  if (rate < 40) return '未掌握';
  if (rate < 60) return '未穩';
  if (rate < 80) return '差少少';
  if (sec > 20) return '識，但慢';
  return '穩';
}
function tagIdx(t) {
  return ({ '未掌握': 0, '未穩': 1, '差少少': 2, '識，但慢': 3, '穩': 4 })[t];
}
function verdictOf_(rate, sec, n) {
  if (n < 6) return '今週數據太少（少過 6 題），做多兩三組先有結論。';
  if (rate >= 85 && sec > 20) return '佢識，但未熟。唔使再教，要練快。';
  if (rate >= 85) return '穩定。可以開始加少少難度。';
  if (rate >= 70) return '大致得，仲有兩三個位要補。';
  if (rate >= 50 && sec <= 10) return '做得快但錯得多，多數係估。要停一停，逐題講。';
  if (rate >= 50) return '一半半。呢個星期揀一兩個重點攻，唔好貪多。';
  if (sec <= 10) return '多數係猜，唔係唔識。要慢返落嚟，一題一題講。';
  return '未掌握。要由最基礎重教，唔好趕進度。';
}

/* ══════════════════════════════════════════════════════════════
   3. 統計工具
   ══════════════════════════════════════════════════════════════ */
function median(a) {
  if (!a.length) return 0;
  var b = a.slice().sort(function (x, y) { return x - y; });
  var m = Math.floor(b.length / 2);
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
}
function dayKey(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}


/* ── 資料來源：伺服器 Answers 聚合（跨裝置、清快取都準） ── */
var REPORT_CACHE = null;
function loadReport(uid) {
  var uidStr = String(uid || '');
  if (!/^\d+$/.test(uidStr) || !window.ParentAdmin || !window.ParentAdmin.post) {
    paintEmpty('未綁定小朋友（或後端未連線）。綁定後這裡會顯示孩子的答題報告。');
    return;
  }
  var big = document.getElementById('big');
  if (big) big.innerHTML = '<span class="t">讀取報告中…</span>';
  window.ParentAdmin.post('reportForParent', { family_id: FAMILY_ID, user_id: uidStr }, function (err, d) {
    if (err || !d || !d.ok) { paintEmpty((d && d.error) || (err && String(err)) || '讀取失敗'); return; }
    REPORT_CACHE = d;
    renderReport(d);
  });
}
function paintEmpty(msg) {
  var e = function (id) { var el = document.getElementById(id); if (el) el.innerHTML = ''; };
  e('big'); e('verdict'); e('stats'); e('week7'); e('workBody'); e('skills'); e('confList'); e('honest');
  var big = document.getElementById('big');
  if (big) big.innerHTML = '<span class="t">' + esc(msg) + '</span>';
  var sk = document.getElementById('skills');
  if (sk) sk.innerHTML = '<div class="why">未有足夠數據。</div>';
}
function enrichSkill(s) {
  return {
    skill: s.skill, subject: s.subject, n: s.n, rate: s.rate, sec: s.sec,
    tag: tagOf_(s.rate, s.sec, s.n),
    act: ACT[s.skill] || ACT_SUBJ[s.subject] || ACT_SUBJ.Math
  };
}
function sortedSkills(list) {
  var a = (list || []).map(enrichSkill);
  a.sort(function (x, y) {
    var nx = x.n >= 3 ? 2 : (x.n >= 2 ? 1 : 0);
    var ny = y.n >= 3 ? 2 : (y.n >= 2 ? 1 : 0);
    if (nx !== ny) return ny - nx;
    var rx = (x.rate >= 80 && x.sec > 20) ? 55 : x.rate;
    var ry = (y.rate >= 80 && y.sec > 20) ? 55 : y.rate;
    if (rx !== ry) return rx - ry;
    return y.n - x.n;
  });
  return a;
}
/* ══════════════════════════════════════════════════════════════
   4. 畫面
   ══════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
}

function renderReport(r) {
  var name = r.display_name || '小朋友';

  /* A */
  document.getElementById('big').innerHTML =
    '<span class="n">' + r.n + '</span><span class="t">題 · 本週（' + r.days + ' 日）</span>' +
    '<span class="n" style="margin-left:14px">' + r.rate + '%</span><span class="t">首答正確</span>';
  document.getElementById('verdict').textContent = verdictOf_(r.rate, r.medSec, r.n);

  var statRows = [
    ['做題日數', r.daysActive, '日'],
    ['中位用時', r.medSec, '秒'],
    ['本週題數', r.n, '題'],
    ['粗心（第2次答對）', (r.summary && r.summary.careless) || 0, '題']
  ];
  document.getElementById('stats').innerHTML = statRows.map(function (x) {
    return '<div class="stat"><div class="k">' + x[0] + '</div><div class="v">' + x[1] +
      '<small>' + x[2] + '</small></div></div>';
  }).join('');

  /* 最近七天長條圖 */
  var wk = document.getElementById('week7');
  if (wk) {
    var mx = Math.max.apply(null, r.perDay.map(function (d) { return d.n; }).concat([1]));
    var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    wk.innerHTML = r.perDay.map(function (d) {
      var h = Math.round(d.n / mx * 46);
      var dow = dayNames[new Date(d.ts).getDay()];
      return '<div class="bar"><div class="bd' + (d.n ? ' on' : '') + '" style="height:' +
        (d.n ? Math.max(6, h) : 3) + 'px"></div><div class="bn">' + d.n + '</div>' +
        '<div class="bl">' + dow + '</div></div>';
    }).join('');
  }

  /* B */
  var sk = sortedSkills(r.skills);
  var pick = sk.filter(function (s) { return s.tag !== '穩'; })[0] || sk[0];
  var wb = document.getElementById('workBody');
  if (!pick) {
    wb.innerHTML = '<div class="do">今週未有足夠數據，今晚照常練一組就好。</div>';
  } else {
    wb.innerHTML =
      '<div class="do">' + esc(pick.act.do) + '</div>' +
      '<div class="why">' + esc(SKILL_NAME[pick.skill] || pick.subject) + '：' + esc(pick.act.why) + '</div>' +
      '<div class="ok">✅ 點樣算過關：' + esc(pick.act.ok) + '</div>' +
      '<div class="only">只做呢一件就夠。做完成件事收工，唔使加碼。</div>';
  }

  /* C */
  var top = sk.slice(0, 3);
  document.getElementById('skills').innerHTML = top.map(function (s, i) {
    return '<div class="sk">' +
      '<div class="idx">' + (i + 1) + '</div>' +
      '<div class="body">' +
        '<div class="hd">' +
          '<span class="nm">' + esc(SKILL_NAME[s.skill] || s.subject) + '</span>' +
          '<span class="pill tag-' + tagIdx(s.tag) + '">' + esc(s.tag) + '</span>' +
          '<span class="rt">' + s.rate + '% · ' + s.n + ' 題 · ' + s.sec + ' 秒</span>' +
        '</div>' +
        '<div class="why">' + esc(s.act.why) + '</div>' +
        '<div class="do">今晚：' + esc(s.act.do) + '</div>' +
        '<div class="ok">✅ ' + esc(s.act.ok) + '</div>' +
      '</div></div>';
  }).join('') || '<div class="why">未有足夠數據。</div>';

  /* D */
  var notes = [];
  if (r.n === 0) notes.push('呢位小朋友今個星期仲未開始做題 —— 先由「10 以內加法」開始，做 5 題就夠。');
  else if (r.n < 6) notes.push('今週只有 ' + r.n + ' 題 —— 樣本太少，下面嘅結論只能當「方向」，唔好當「判決」。');
  if ((r.summary && r.summary.wrong || 0) >= 2) notes.push('答錯 ' + r.summary.wrong + ' 題' + (r.summary.fastWrong ? '（其中 ' + r.summary.fastWrong + ' 題 3 秒內就答，多數係猜）' : '') + '：今晚陪佢慢慢讀一次題目。');
  var weak = sk.filter(function (s) { return s.n >= 3 && s.rate < 60; })[0];
  if (weak) notes.push('「' + (SKILL_NAME[weak.skill] || weak.subject) + '」' + weak.rate + '%（' + weak.n + ' 題）—— 呢個係最值得花時間嘅一項。');
  if (r.daysActive >= 5) notes.push('一星期有 ' + r.daysActive + ' 日都有做，習慣已經成形，保持落去就夠。');
  if (r.n >= 8 && r.medSec > 0 && r.medSec < 3) notes.push('中位用時只有 ' + r.medSec + ' 秒 —— 可能係亂按，亦可能係好熟；可以抽一題叫佢講出點計。');
  document.getElementById('confList').innerHTML = notes.length
    ? notes.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('')
    : '<div class="none">✅ 今週樣本足夠，冇特別要提醒嘅偏差。</div>';

  var foot = document.getElementById('foot');
  if (foot) foot.textContent = '實際紀錄 · 只計 ' + name + ' 自己的答題（共 ' + r.n + ' 題）；數據不夠就照講';

  document.getElementById('honest').textContent =
    '呢個報告只用「' + name + '」真實答題紀錄計：' + r.n + ' 題、' + r.days + ' 日。' +
    '佢唔會評分、唔會排名、唔會同其他小朋友比較 —— 只係同佢自己上星期比。' +
    '數據有偏差就照講，唔會為咗好睇而修飾。';
}

/* ── 家庭 → 孩子：家長用家庭 PIN 登入後，才知道要顯示哪個孩子 ── */
var FAMILY_ID = 1;
var KIDS = [];
var KID = null;

function currentUid(){
  if (KID && KID.id) return String(KID.id);
  if (window.Player) {
    var u = Player.cur() || (Player.bound() && Player.bound().id);
    if (u) return String(u);
  }
  return 'demo_a';
}
function paintWho(){
  var el = document.getElementById('whoName');
  if (!el) return;
  el.textContent = KID ? (KID.nick || KID.name || '—') : '未登入';
}
function paintKids(){
  var box = document.getElementById('kidPick');
  if (!box) return;
  box.innerHTML = '';
  if (KIDS.length < 2) return;              /* 只有一個孩子就不用選 */
  KIDS.forEach(function (u) {
    var b = document.createElement('button');
    b.textContent = (u.nick || u.name || '孩子') + (u.grade ? ' · ' + u.grade : '');
    if (KID && String(KID.id) === String(u.id)) b.className = 'on';
    b.addEventListener('click', function () { pickKid(u); });
    box.appendChild(b);
  });
}
function pickKid(u){
  KID = u;
  paintWho(); paintKids();
  loadReport(String(u.id));
  renderTime();
}
function mountAdmin(){
  if (!window.ParentAdmin) return;
  window.ParentAdmin.mount(document.getElementById('adminMount'), FAMILY_ID);
}
function applyFamily(d){
  if (!d || !d.ok) return;
  var fam = d.family || {};
  FAMILY_ID = Number(fam.id) || 1;
  KIDS = d.users || [];
  KID = KIDS[0] || null;
  paintWho(); paintKids();
  loadReport(KID ? String(KID.id) : currentUid());
  renderTime();
  mountAdmin();
  if (!KIDS.length && window.ParentAdmin && window.ParentAdmin.post) {
    /* 舊 session 沒有名單：補抓一次 */
    window.ParentAdmin.post('listUsers', { family_id: FAMILY_ID }, function (er, r) {
      if (er || !r || !r.ok) return;
      var act = (r.users || []).filter(function (u) {
        return !(u.Active === false || String(u.Active).toUpperCase() === 'FALSE');
      });
      KIDS = act;
      if (KIDS.length) pickKid(KIDS[0]);
      paintKids();
    });
  }
}

/* 報告 / 管理 兩 tab */
(function () {
  var tabs = document.querySelectorAll('#mainTabs .mainTab');
  function show(view) {
    var vr = document.getElementById('viewReport');
    var vm = document.getElementById('viewManage');
    if (vr) vr.style.display = (view === 'report') ? '' : 'none';
    if (vm) vm.style.display = (view === 'manage') ? '' : 'none';
    tabs.forEach(function (t) { t.classList.toggle('on', t.getAttribute('data-view') === view); });
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { show(t.getAttribute('data-view')); });
  });
})();

paintWho();
loadReport(currentUid());
renderTime();

window.PARENT_ON_LOGIN = applyFamily;
if (window.PARENT_RESULT && window.PARENT_RESULT.ok) applyFamily(window.PARENT_RESULT);

/* E 娛樂時間（金幣 → 時間卷；以伺服器 myStatus 為準） */
function mmss(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m > 9 ? m : '0' + m) + ':' + (s > 9 ? s : '0' + s);
}
function renderTime(){
  var el = document.getElementById('timeStats');
  var note = document.getElementById('timeNote');
  if (!el) return;
  var uid = currentUid();
  if (!/^\d+$/.test(String(uid)) || !window.ParentAdmin || !window.ParentAdmin.post) {
    el.innerHTML = '<div class="why">未綁定小朋友（或後端未連線），所以沒有金幣與時間卷資料。</div>';
    if (note) note.textContent = '綁定後這裡會顯示：金幣餘額、今日已換幾分鐘、正在使用的倒數。';
    return;
  }
  el.innerHTML = '<div class="why">讀取中…</div>';
  window.ParentAdmin.post('myStatus', { user_id: uid }, function (err, d) {
    if (err || !d || !d.ok) {
      el.innerHTML = '<div class="why">讀取失敗：' + esc(err || (d && d.error) || '未知錯誤') + '</div>';
      return;
    }
    var st = d.session || {};
    var free = (st.mode === 'free' && (st.remaining_sec || 0) > 0);
    el.innerHTML =
      '<div class="stat"><div class="k">金幣餘額</div><div class="v">' + (d.coins || 0) + ' <small>枚</small></div></div>' +
      '<div class="stat"><div class="k">今日已換</div><div class="v">' + (d.today_minutes || 0) + ' <small>/ ' + (d.today_cap || 0) + ' 分鐘</small></div></div>' +
      '<div class="stat"><div class="k">' + (free ? '正在使用' : '目前狀態') + '</div><div class="v">' +
        (free ? mmss(st.remaining_sec) : '🔒 學習模式') + '</div></div>';
    document.getElementById('capInput').value = d.today_cap || '';
    var perQ = 25, perMin = 5;
    if (REPORT_CACHE && REPORT_CACHE.config) {
      perQ = Number(REPORT_CACHE.config.per_question) || 25;
      perMin = Number(REPORT_CACHE.config.per_minute) || 5;
    }
    if (note) note.textContent =
      '規則：答對一題賺 ' + perQ + ' 金幣（難題更多）。' + perMin + ' 金幣 = 1 分鐘娛樂，孩子自己用金幣換時間卷：'
      + '15 分鐘 ' + (15 * perMin) + ' 金幣、30 分鐘 ' + (30 * perMin) + ' 金幣、60 分鐘 ' + (60 * perMin) + ' 金幣；換了即刻開始計時，沒有存券。'
      + '每日上限 ' + (d.today_cap || 0) + ' 分鐘。星星只負責進化，不能換回時間。';
  });
}
renderTime();
document.getElementById('capSave').addEventListener('click', function(){
  var v = parseInt(document.getElementById('capInput').value, 10);
  if (!(v >= 0)) { alert('請輸入 0 或更大的整數分鐘'); return; }
  if (!window.ParentAdmin || !window.ParentAdmin.post) { alert('後端未連線，暫時改不了。'); return; }
  window.ParentAdmin.post('setConfig', { key: 'MAX_MINUTES_PER_DAY', value: v }, function (err, d) {
    if (err || !d || !d.ok) { alert('儲存失敗：' + (err || (d && d.error) || '未知錯誤')); return; }
    renderTime();
  });
});

window.__report = { load: loadReport, render: renderReport };
</script>
