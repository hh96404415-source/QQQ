<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B2%3C/text%3E%3C/svg%3E">
<title>三問 · 登入</title>
<link rel="stylesheet" href="fonts/theme.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#0b1220;color:#e2e8f0;overflow:hidden;
       font-family:"Huninn","Microsoft JhengHei",system-ui,sans-serif}
  #bg{position:fixed;inset:0;background:url('images/bg_farm.webp') center bottom/auto 143% no-repeat;
      filter:brightness(.55) saturate(.95)}
  #bg::after{content:"";position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 38%,rgba(11,18,32,.05),rgba(11,18,32,.82) 74%)}

  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
        align-items:center;justify-content:center;padding:24px;gap:16px;text-align:center}

  .brand{font-size:15px;letter-spacing:6px;color:#93a4bd;font-weight:800;
         user-select:none;-webkit-user-select:none;cursor:default}
  h1{margin:0;font-size:clamp(24px,3.4vmin,34px);font-weight:900;letter-spacing:1px}
  .sub{margin:0;color:#93a4bd;font-size:15px;line-height:1.7}

  /* ── 6 位數 ── */
  .dots{display:flex;gap:14px;margin:6px 0 2px}
  .dot{width:44px;height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.18);
       background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;
       font-size:26px;font-weight:900;color:#fbbf24;transition:.14s}
  .dot.on{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.14)}
  .pad{display:grid;grid-template-columns:repeat(3,minmax(0,86px));gap:12px;margin-top:12px}
  .key{height:62px;border-radius:18px;border:2px solid rgba(255,255,255,.12);
       background:rgba(30,41,59,.85);color:#e2e8f0;font-size:26px;font-weight:900;cursor:pointer;
       font-family:inherit;transition:transform .1s,background .12s}
  .key:hover{background:rgba(51,65,85,.95)}
  .key:active{transform:scale(.93)}
  .key.fn{font-size:20px;color:#94a3b8}
  .shake{animation:shk .34s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

  .err{color:#fca5a5;font-size:14px;font-weight:800;min-height:22px;max-width:520px;line-height:1.6}
  .hint{color:#64748b;font-size:13px;max-width:520px;line-height:1.8}

  /* ── 歡迎回來 ── */
  #hello{display:flex;flex-direction:column;align-items:center;gap:10px}
  #hello .ava{font-size:76px;line-height:1;filter:drop-shadow(0 0 24px rgba(251,191,36,.55))}
  #hello .nm{font-size:clamp(26px,4vmin,40px);font-weight:900}
  #hello .gd{font-size:14px;color:#93a4bd;font-weight:800}
  .go{margin-top:6px;padding:14px 34px;border-radius:999px;border:0;cursor:pointer;
      font-family:inherit;font-size:20px;font-weight:900;color:#3b2405;
      background:linear-gradient(180deg,#fde047,#f59e0b);box-shadow:0 10px 26px rgba(245,158,11,.35)}
  .go:active{transform:scale(.96)}

  footer{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:#64748b}
  footer a,footer button{color:#93a4bd;font-weight:800;text-decoration:none;
        border:0;border-bottom:1px dashed rgba(147,164,189,.5);background:none;
        font-family:inherit;font-size:13px;cursor:pointer;padding:0}
  footer a:hover,footer button:hover{color:#fbbf24;border-color:#fbbf24}

  /* ── 登入紀錄 ── */
  #logMask{position:fixed;inset:0;z-index:60;background:rgba(5,9,16,.72);
           display:flex;align-items:center;justify-content:center;padding:24px}
  #logBox{width:min(560px,100%);max-height:70vh;overflow:auto;background:#0f172a;
          border:2px solid rgba(255,255,255,.14);border-radius:20px;padding:18px 20px;text-align:left}
  #logBox h3{margin:0 0 4px;font-size:18px}
  #logBox p{margin:0 0 12px;font-size:12.5px;color:#7f8ea8;line-height:1.6}
  #logBox .row{display:flex;gap:10px;align-items:baseline;padding:9px 0;
               border-top:1px solid rgba(255,255,255,.07);font-size:13.5px}
  #logBox .row b{color:#e2e8f0}
  #logBox .row i{font-style:normal;color:#7f8ea8;font-size:12px}
  #logBox .empty{color:#64748b;font-size:13px;padding:14px 0}
  #logBox .x{float:right;border:0;background:rgba(255,255,255,.08);color:#cbd5e1;
             border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:800;cursor:pointer}

  /* ── 家長：解除綁定 ── */
  #ubMask{position:fixed;inset:0;z-index:70;background:rgba(5,9,16,.82);
          display:flex;align-items:center;justify-content:center;padding:24px}
  #ubBox{width:min(480px,100%);background:#0f172a;border:2px solid rgba(255,255,255,.14);
         border-radius:20px;padding:22px;text-align:left}
  #ubBox h3{margin:0 0 8px;font-size:19px}
  #ubBox p{margin:0 0 14px;font-size:13.5px;color:#94a3b8;line-height:1.8}
  #ubBox .row{display:flex;gap:10px;margin-top:14px}
  #ubBox .btn{flex:1;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.14);
              background:rgba(30,41,59,.9);color:#e2e8f0;font-family:inherit;font-weight:900;
              font-size:15px;cursor:pointer}
  #ubBox .btn.danger{background:rgba(127,29,29,.55);border-color:rgba(248,113,113,.5);color:#fecaca}
  #ubBox .btn:active{transform:scale(.97)}
  #ubBox input{width:100%;padding:14px;border-radius:14px;border:2px solid rgba(255,255,255,.16);
               background:rgba(2,6,23,.7);color:#fbbf24;font-family:inherit;font-size:24px;
               font-weight:900;letter-spacing:10px;text-align:center}

  .hidden{display:none !important}
</style>
</head>
<body>
<div id="bg"></div>

<div class="wrap">
  <div class="brand" id="brand">三 問</div>

  <!-- ① 已綁定：歡迎回來 -->
  <section id="stepHello" class="hidden">
    <div id="hello">
      <span class="ava" id="hAva">🐲</span>
      <span class="nm" id="hName">小明</span>
      <span class="gd" id="hGrade"></span>
      <button class="go" id="hGo" type="button">開始玩 →</button>
      <span class="hint" style="margin-top:10px;font-size:12px;color:#64748b">這部機已經記住你，下次開頁不用再打數字</span>
    </div>
  </section>

  <!-- ② 未綁定：輸入 6 位數字 -->
  <section id="stepKey" class="hidden">
    <h1>你的 6 位數字</h1>
    <p class="sub" id="keySub">家長把密碼填在名冊裡，打一次就記住這部機</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="err" id="err"></div>
  </section>
</div>

<footer>
  <button id="logOpen" type="button">登入紀錄</button>　|　<a href="parent.html">家長看報告 →</a>
</footer>

<div id="logMask" class="hidden">
  <div id="logBox">
    <button class="x" id="logClose" type="button">關閉</button>
    <h3>登入紀錄</h3>
    <p>這部機什麼時候、用哪個密碼登入過。要換人：長按首頁的「三 問」3 秒。</p>
    <div id="logRows"></div>
  </div>
</div>

<div id="ubMask" class="hidden">
  <div id="ubBox">
    <h3>解除這部機的綁定？</h3>
    <p>解除之後要重新輸入 6 位數字才能玩。小朋友的星星、寵物不會被刪。</p>
    <input id="ubCode" type="tel" inputmode="numeric" maxlength="6" placeholder="再打一次 6 位數">
    <div class="err" id="ubErr" style="margin-top:8px"></div>
    <div class="row">
      <button class="btn" id="ubCancel" type="button">取消</button>
      <button class="btn danger" id="ubOk" type="button">解除綁定</button>
    </div>
  </div>
</div>

<script src="player.js"></script>
<script>
(function () {
  var LOG_KEY = 'dsh__login_log';
  var QA_KEY = 'dsh_qa';
  var DEFAULT_GAS = 'https://script.google.com/macros/s/AKfycbydbycnfQsKkirktxFhKOB9p847SlW3e7Jd8oudLykEgkh_zp4ATPde4XIc476JcWNl/exec';
  var DEFAULT_TOKEN = 'CHANGE_ME_TO_A_RANDOM_LONG_STRING';

  var stepHello = document.getElementById('stepHello');
  var stepKey = document.getElementById('stepKey');
  var dotsEl = document.getElementById('dots');
  var errEl = document.getElementById('err');
  var keySub = document.getElementById('keySub');
  var buf = '';
  var busy = false;
  var failCount = 0;

  /* ── GAS 連線設定：優先用挑戰頁那組 ─────────────────────── */
  function gasCfg() {
    var o = {};
    try { o = JSON.parse(localStorage.getItem(QA_KEY) || '{}'); } catch (e) {}
    /* 網址可以臨時用 ?gas=<新網址>&token=<新token> 覆寫（會被記住） */
    var qs = new URLSearchParams(location.search);
    if (qs.get('gas')) {
      o.url = qs.get('gas');
      if (qs.get('token')) o.token = qs.get('token');
      try { localStorage.setItem(QA_KEY, JSON.stringify({ url: o.url, token: o.token || DEFAULT_TOKEN, uid: o.uid || 'kid01', pin: o.pin || '', on: true })); } catch (e) {}
    }
    return { url: o.url || DEFAULT_GAS, token: o.token || DEFAULT_TOKEN };
  }

  function gasHost() {
    var u = gasCfg().url || '';
    var m = u.match(/\/macros\/s\/([A-Za-z0-9_-]{8,})/);
    return m ? ('…' + m[1].slice(-6)) : u.slice(0, 32);
  }

  function post(body) {
    var c = gasCfg();
    body.token = c.token;
    return fetch(c.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function (r) { return r.json(); });
  }

  /* ── 登入紀錄 ────────────────────────────────────────────── */
  function pushLogin(st) {
    var rows = [];
    try { rows = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (e) {}
    rows.push({ t: Date.now(), id: st.id, name: st.name || '', ua: navigator.userAgent.slice(0, 120) });
    if (rows.length > 60) rows = rows.slice(-60);
    localStorage.setItem(LOG_KEY, JSON.stringify(rows));
  }

  function ago(ts) {
    var d = Date.now() - ts;
    if (d < 60000) return '剛剛';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分鐘前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小時前';
    return Math.floor(d / 86400000) + ' 天前';
  }

  /* ── 鍵盤 ────────────────────────────────────────────────── */
  for (var i = 0; i < 6; i++) {
    var d = document.createElement('span');
    d.className = 'dot';
    dotsEl.appendChild(d);
  }
  var dots = dotsEl.children;

  function paint() {
    for (var i = 0; i < 6; i++) {
      var on = i < buf.length;
      dots[i].classList.toggle('on', on);
      dots[i].textContent = on ? '●' : '';
    }
  }
  paint();

  /* 錯誤訊息裡的「先用示範帳號」是每次重畫的，用委派接 */
  errEl.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('#demoGo') : null;
    if (a) { e.preventDefault(); bindDemo(); }
  });

  var pad = document.getElementById('pad');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '←', '0', ''].forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    if (!k) { b.style.visibility = 'hidden'; pad.appendChild(b); return; }
    b.className = 'key' + (k === '←' ? ' fn' : '');
    b.textContent = k;
    b.addEventListener('click', function () {
      if (busy) return;
      if (k === '←') { buf = buf.slice(0, -1); paint(); errEl.textContent = ''; return; }
      if (buf.length >= 6) return;
      buf += k; paint(); errEl.textContent = '';
      if (buf.length === 6) submit();
    });
    pad.appendChild(b);
  });

  document.addEventListener('keydown', function (e) {
    if (stepKey.classList.contains('hidden') || busy) return;
    if (/^[0-9]$/.test(e.key)) {
      if (buf.length < 6) { buf += e.key; paint(); if (buf.length === 6) submit(); }
    } else if (e.key === 'Backspace') { buf = buf.slice(0, -1); paint(); }
  });

  function shake() {
    dotsEl.classList.remove('shake');
    void dotsEl.offsetWidth;
    dotsEl.classList.add('shake');
  }

  function submit() {
    if (busy) return;
    if (buf.length !== 6) { errEl.textContent = '要 6 位數字'; return; }
    busy = true;
    errEl.textContent = '正在核對…';
    keySub.textContent = '第一次會慢一點，之後就自動進來了';

    post({ action: 'login', pin: buf }).then(function (r) {
      if (r && r.ok && r.student && r.student.id) {
        done(r.student);
        return;
      }
      busy = false;
      failCount++;
      shake();
      buf = ''; paint();
      var msg;
      if (r && r.error === 'token 錯誤') {
        msg = '連上了，但 token 不對。請家長在 GAS 把 CONFIG.TOKEN 改成跟網頁一樣。';
      } else if (r && /未知 action/.test(r.error)) {
        msg = '名冊還沒開通：GAS 那個部署還是舊版（' + gasHost() + '）。' +
              '要「管理部署 → 編輯 → 版本選新版本 → 部署」，網址才不會變。';
      } else if (r && r.error) {
        msg = r.error;
      } else {
        msg = '核對不到，再試一次。';
      }
      errEl.innerHTML = msg + '<br>' + demoLink();
    }).catch(function () {
      busy = false;
      failCount++;
      shake();
      buf = ''; paint();
      errEl.innerHTML = '連不上名冊（網絡或 GAS 沒開）。<br>' + demoLink();
    });
  }

  /* 錯誤時都給一條「先用示範帳號」的後路 */
  function demoLink() {
    return '<a href="#" id="demoGo" style="color:#fbbf24">先用示範帳號玩 →</a>';
  }

  function bindDemo() {
    done({ id: 'demo_a', name: '陳小明', nick: '小明', emoji: '🐲', grade: '示範帳號' });
  }

  function done(st) {
    Player.bind(st);
    pushLogin(st);
    location.href = 'community.html';
  }

  /* ── 已綁定：歡迎回來 ────────────────────────────────────── */
  function showHello() {
    var m = Player.meta();
    document.getElementById('hAva').textContent = m.emoji;
    document.getElementById('hName').textContent = m.nick || m.name;
    document.getElementById('hGrade').textContent = m.tag || '';
    stepKey.classList.add('hidden');
    stepHello.classList.remove('hidden');
    document.getElementById('hGo').addEventListener('click', function () {
      location.href = 'community.html';
    });
  }

  if (Player.bound()) {
    showHello();
  } else {
    stepHello.classList.add('hidden');
    stepKey.classList.remove('hidden');
  }

  /* ── 家長：長按「三 問」3 秒 → 解除綁定 ─────────────────── */
  var brand = document.getElementById('brand');
  var holdTimer = null;
  function startHold() {
    if (!Player.bound()) return;
    holdTimer = setTimeout(function () {
      document.getElementById('ubMask').classList.remove('hidden');
      document.getElementById('ubCode').value = '';
      document.getElementById('ubErr').textContent = '';
    }, 2500);
  }
  function endHold() { clearTimeout(holdTimer); }
  brand.addEventListener('pointerdown', startHold);
  brand.addEventListener('pointerup', endHold);
  brand.addEventListener('pointerleave', endHold);
  brand.addEventListener('pointercancel', endHold);

  document.getElementById('ubCancel').addEventListener('click', function () {
    document.getElementById('ubMask').classList.add('hidden');
  });
  document.getElementById('ubOk').addEventListener('click', function () {
    var code = (document.getElementById('ubCode').value || '').trim();
    var ubErr = document.getElementById('ubErr');
    if (!/^\d{6}$/.test(code)) { ubErr.textContent = '要 6 位數字'; return; }
    ubErr.textContent = '核對中…';
    post({ action: 'login', pin: code }).then(function (r) {
      var m = Player.meta();
      if (r && r.ok && r.student && String(r.student.id) === String(m.id)) {
        Player.unbind();
        location.reload();
      } else {
        ubErr.textContent = '這不是這位小朋友的密碼。';
      }
    }).catch(function () {
      /* 連不上就接受本機已有的綁定（避免被鎖在外面） */
      Player.unbind();
      location.reload();
    });
  });

  /* ── 登入紀錄 ────────────────────────────────────────────── */
  var logMask = document.getElementById('logMask');
  document.getElementById('logOpen').addEventListener('click', function () {
    var rows = [];
    try { rows = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (e) {}
    var box = document.getElementById('logRows');
    if (!rows.length) {
      box.innerHTML = '<div class="empty">還沒有紀錄。登入一次就會出現在這裡。</div>';
    } else {
      box.innerHTML = rows.slice(-20).reverse().map(function (r) {
        var d = new Date(r.t);
        var hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        return '<div class="row"><b>' + (r.name || r.id) + '</b>' +
          '<i>' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + '</i>' +
          '<i>' + ago(r.t) + '</i></div>';
      }).join('');
    }
    logMask.classList.remove('hidden');
  });
  document.getElementById('logClose').addEventListener('click', function () {
    logMask.classList.add('hidden');
  });
  logMask.addEventListener('click', function (e) {
    if (e.target === logMask) logMask.classList.add('hidden');
  });
})();
</script>
</body>
</html>
