<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🐲 寵物社區</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.92em%22 font-size=%2292%22%3E%F0%9F%90%B2%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:"Microsoft JhengHei","Segoe UI",sans-serif;overflow:hidden;background:#0f172a}
  #app{display:flex;height:100vh;height:100dvh}

  /* ── 左半 ── */
  #farmPane{position:relative;width:50%;height:100%;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.1)}
  #farmArea{flex:1;position:relative;overflow:hidden;
    background:
      linear-gradient(180deg, rgba(12,24,44,.34) 0%, rgba(12,24,44,.12) 24%, rgba(12,24,44,0) 36%),
      url('images/bg_farm.webp') center bottom / auto 143% no-repeat,
      linear-gradient(180deg,#6cc3f0 0%,#9ad9f7 24%,#d9f1ff 40%,#a8d977 41%,#78c04a 63%,#4a9431 100%)}
  .cloud{position:absolute;background:#fff;border-radius:50%;opacity:.9}
  .tree{position:absolute;font-size:clamp(36px,7vmin,60px);filter:drop-shadow(0 4px 2px rgba(0,0,0,.15));pointer-events:none}
  .pond{position:absolute;border-radius:50%;background:radial-gradient(#7dd3fc,#38bdf8);opacity:.8;pointer-events:none}
  .fence{position:absolute;left:0;right:0;bottom:0;height:14px;
    background:repeating-linear-gradient(90deg,#a16207 0 10px,transparent 10px 18px);
    border-top:3px solid #854d0e;pointer-events:none}
  .flower{position:absolute;font-size:clamp(14px,2.6vmin,20px);pointer-events:none;opacity:.9}
  #fxLayer{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .firefly{position:absolute;width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle,#fef9c3 0%,#fde047 45%,transparent 72%);
    box-shadow:0 0 12px 4px rgba(253,224,71,.5);animation:firefly 6s ease-in-out infinite;opacity:.2}
  @keyframes firefly{0%,100%{opacity:.12;transform:translate(0,0)}50%{opacity:.85;transform:translate(8px,-14px)}}
  .pet{position:absolute;width:clamp(64px,12vmin,96px);height:clamp(64px,12vmin,96px);
    cursor:pointer;transition:filter .2s;will-change:transform,left,top;transform-origin:center bottom}
  .pet::before{content:'';position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
    width:64%;height:12px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(3px);z-index:0}
  .pet img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;
    position:relative;z-index:1;animation:petBreathe 2.8s ease-in-out infinite;
    transform-origin:50% 100%;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
  @keyframes petBreathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.022)}}
  @keyframes petHop{0%{transform:translateY(0) scaleY(1)}14%{transform:translateY(-16px) scaleY(1.06)}
    30%{transform:translateY(0) scaleY(.92)}44%{transform:translateY(-7px) scaleY(1.03)}
    60%{transform:translateY(0) scaleY(.97)}100%{transform:translateY(0) scaleY(1)}}
  .pet img.hop{animation:petHop .85s cubic-bezier(.25,1.5,.5,1)}
  .pet.excited{filter:drop-shadow(0 0 10px #fff6a0) brightness(1.08);animation:pulse .9s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .pet .bubble{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%) scale(.86);
    font-size:15px;line-height:1.45;font-weight:800;color:#1e293b;background:#fff;
    padding:7px 12px;border-radius:14px;max-width:200px;width:max-content;text-align:center;
    box-shadow:0 10px 24px rgba(0,0,0,.4);pointer-events:none;opacity:0;z-index:7;
    transition:opacity .2s, transform .2s;white-space:normal}
  .pet.show-bubble .bubble{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .pet .bubble::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;
    width:11px;height:11px;background:#fff;transform:rotate(45deg);border-radius:2px}
  .pet .bubble.emoji{font-size:22px;padding:4px 10px}
  .pet.sad img{filter:grayscale(.8) brightness(.75)}
  #farmHint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    background:rgba(15,23,42,.66);color:#fff;font-size:clamp(15px,2.4vmin,18px);font-weight:800;
    padding:7px 16px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
    transition:opacity .4s}

  /* 左半底部：寵物條（橫向捲動 + 分頁箭頭，100 隻也不會爆） */
  #petBarWrap{position:relative;height:96px;flex:none;display:flex;align-items:center;
    background:#0f172a;border-top:1px solid rgba(255,255,255,.1)}
  #petBar{flex:1;min-width:0;height:100%;display:flex;gap:8px;padding:8px 2px;
    overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;
    scrollbar-width:none;-ms-overflow-style:none}
  #petBar::-webkit-scrollbar{display:none}
  .pbarNav{flex:none;width:32px;height:66px;margin:0 3px;border:0;border-radius:10px;
    background:rgba(255,255,255,.08);color:#cbd5e1;font-size:22px;font-weight:900;line-height:1;
    cursor:pointer;transition:background .15s,opacity .15s}
  .pbarNav:hover:not(:disabled){background:rgba(255,255,255,.16);color:#fff}
  .pbarNav:disabled{opacity:.22;cursor:default}
  .chip{width:70px;flex:none;scroll-snap-align:center;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.06);
    padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .chip img{width:42px;height:42px;object-fit:contain}
  .chip .nm{font-size:13px;color:#cbd5e1;white-space:nowrap}
  .chip.sel{border-color:#fbbf24;background:rgba(251,191,36,.15)}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
  .chip .dot.egg{background:#f59e0b}
  .chip .dot.sad{background:#ef4444}

  /* ── 右半：遊戲區 ── */
  #gamePane{position:relative;width:50%;height:100%;padding:12px;display:flex;flex-direction:column;gap:10px;
    background:
      linear-gradient(180deg, rgba(9,16,30,.18) 0%, rgba(9,16,30,.44) 46%, rgba(9,16,30,.74) 100%),
      url('images/bg_playground.webp') center 32% / cover no-repeat,
      linear-gradient(#1e293b,#0f172a)}
  .ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .gtitle{color:#fbbf24;font-weight:900;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.55)}
  .gsub{color:#94a3b8;font-size:14px;margin-left:auto}
  .pgrid{flex:1;display:grid;gap:8px;align-content:center}
  .card{position:relative;border-radius:12px;background:#334155;cursor:pointer;
    display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-height:44px;
    user-select:none;transition:transform .15s,background .2s}
  .card:active{transform:scale(.96)}
  .card .back{font-size:clamp(20px,5vmin,32px);color:#94a3b8;font-weight:900}
  .card .face{display:none;font-size:clamp(22px,5.5vmin,38px)}
  .card.flipped{background:#f8fafc}
  .card.flipped .back{display:none}
  .card.flipped .face{display:block}
  .card.matched{background:#166534;opacity:.55;cursor:default}
  .card.matched .back{display:none}
  .card.matched .face{display:block;filter:grayscale(.2)}
  .gmsg{text-align:center;color:#fde68a;font-weight:900;font-size:24px;min-height:32px;padding:5px 16px;
    border-radius:999px;background:rgba(15,23,42,.55);align-self:center;max-width:94%;
    box-shadow:0 2px 10px rgba(0,0,0,.35);text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .gmsg.win{color:#4ade80}
  .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:999px;padding:6px 12px;color:#fff;font-weight:800;font-size:16px}
  #btnStar{background:linear-gradient(#f59e0b,#d97706);color:#1e1b4b;border:none;
    border-radius:999px;padding:8px 14px;font-weight:900;font-size:14px;cursor:pointer;
    box-shadow:0 3px 0 #92400e;font-family:inherit}
  #btnStar:active{transform:translateY(2px);box-shadow:0 1px 0 #92400e}
  #btnRestart{background:#334155;color:#e2e8f0;border:none;border-radius:999px;
    padding:9px 18px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}

  /* ── 面板 ── */

  /* ══════════ 社區設施（用星星建造／升級） ══════════ */
  #facLayer{position:absolute;inset:0;pointer-events:none}
  .fac{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;line-height:1;
    transition:transform .18s}
  .fac:hover{transform:translate(-50%,-100%) scale(1.08)}
  .fac .fico{font-size:60px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .fac .flv{position:absolute;right:-6px;top:-2px;font-size:10px;font-weight:900;color:#0f172a;
    background:linear-gradient(180deg,#fde68a,#fbbf24);border-radius:999px;padding:1px 6px;
    border:1px solid rgba(120,53,15,.5)}
  .fac.empty .fico{font-size:26px;color:rgba(255,255,255,.8);
    width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:2px dashed rgba(255,255,255,.6);background:rgba(15,23,42,.25)}
  .fac.pop{animation:facPop .5s ease-out}
  @keyframes facPop{0%{transform:translate(-50%,-100%) scale(1)}40%{transform:translate(-50%,-100%) scale(1.28)}100%{transform:translate(-50%,-100%) scale(1)}}

  #facCard{position:absolute;z-index:9750;width:min(230px,80%);padding:12px;
    border-radius:16px;background:rgba(15,23,42,.97);border:1px solid rgba(255,255,255,.16);
    box-shadow:0 18px 40px rgba(0,0,0,.5);display:none}
  #facCard.show{display:block}
  #facCard h4{margin:0 0 4px;font-size:17px;color:#fde047}
  #facCard .frow{font-size:12.5px;color:#cbd5e1;margin:3px 0}
  #facCard button{display:block;width:100%;margin-top:8px}

  #panel{position:absolute;left:0;top:0;width:min(240px,78%);
    background:linear-gradient(160deg, rgba(30,41,59,.97), rgba(15,23,42,.99));
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);
    border-radius:16px;padding:16px;z-index:9700;color:#e2e8f0;
    box-shadow:0 20px 50px rgba(0,0,0,.6);display:none}
  #panel.show{display:block}
  #panel .name{font-size:22px;font-weight:900;color:#fbbf24}
  #panel .form{font-size:15px;color:#94a3b8;margin-top:2px}
  #panel .mood{font-size:17px;margin-top:8px;min-height:18px}
  #panel .avatar{display:none}
  #panel button{width:100%;border:none;border-radius:10px;padding:12px;
    font-weight:900;font-size:17px;cursor:pointer;margin-top:8px;font-family:inherit;
    box-shadow:0 4px 0 rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .08s, box-shadow .08s}
  #panel button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.18)}
  #panel .pbar{height:12px;background:#334155;border-radius:999px;margin-top:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.25)}
  #panel .pbar-fill{height:100%;width:0%;background:linear-gradient(90deg,#fbbf24,#f59e0b);
    border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  #panel .ptxt{font-size:13px;font-weight:800;color:#fbbf24;margin-top:4px;text-align:center;min-height:16px}
  #btnFeed{background:linear-gradient(#f59e0b,#d97706);color:#1e1b4b}
  #btnQuiz{background:linear-gradient(#f43f5e,#e11d48);color:#fff}
  #btnGame{background:linear-gradient(#a78bfa,#7c3aed);color:#fff}
  #btnGame:disabled{background:#334155;color:#64748b;cursor:not-allowed}
  #btnFeed:disabled{background:#334155;color:#64748b;cursor:not-allowed}
  /* 星星夠了 → 餵食鍵變成進化鍵（金色脈動） */
  #btnFeed.evolve{background:linear-gradient(180deg,#fde047,#f59e0b 55%,#dc2626);color:#3b0764;
    box-shadow:0 0 0 2px rgba(253,224,71,.85),0 8px 24px rgba(245,158,11,.6);
    animation:evolvePulse 1.25s ease-in-out infinite}
  #btnFeed.evolve:disabled{background:#334155;animation:none;box-shadow:none;color:#64748b}
  @keyframes evolvePulse{
    0%,100%{transform:scale(1);box-shadow:0 0 0 2px rgba(253,224,71,.85),0 8px 24px rgba(245,158,11,.55)}
    50%{transform:scale(1.045);box-shadow:0 0 0 4px rgba(253,224,71,.55),0 10px 30px rgba(220,38,38,.55)}
  }
  #btnPlay{background:linear-gradient(#38bdf8,#0284c7);color:#052e16}
  #btnComfort{background:linear-gradient(#f472b6,#db2777);color:#fff}
  #btnToggle{background:linear-gradient(#22c55e,#16a34a);color:#052e16}
  #btnToggle:disabled{background:#334155;color:#64748b;cursor:not-allowed}
  #btnTrade{background:linear-gradient(#34d399,#059669);color:#022c22}
  #btnTrade:disabled{background:#334155;color:#64748b;cursor:not-allowed}
  #btnClose{background:#334155;color:#cbd5e1}
  .hidden{display:none!important}

  @media (max-aspect-ratio: 3/4){
    #app{flex-direction:column}
    #farmPane{width:100%;height:52%}
    #gamePane{width:100%;height:48%}
  }

  /* ── 反饋動畫 ── */
  .card{perspective:600px;background:transparent;animation:cardIn .32s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes cardIn{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .card .inner{position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform .33s cubic-bezier(.4,0,.2,1);border-radius:12px}
  .card.flipped .inner{transform:rotateY(180deg)}
  .card .back,.card .face{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;backface-visibility:hidden;border-radius:12px}
  .card .back{background:#334155;font-size:clamp(20px,5vmin,32px);color:#94a3b8;font-weight:900}
  .card .face{background:#f8fafc;transform:rotateY(180deg);font-size:clamp(22px,5.5vmin,38px)}
  .card.flipped .back,.card.flipped .face,.card.matched .back,.card.matched .face{display:flex}
  .card.matched .inner{transform:rotateY(180deg) scale(.9)}
  .card.matched .face{background:#166534;color:#fff;box-shadow:inset 0 0 0 3px #4ade80}
  .card.matched{opacity:.65;cursor:default}
  .card.wrong .inner{animation:shakeIt .5s}
  @keyframes shakeIt{0%,100%{transform:rotateY(180deg) scale(1)}15%{transform:rotateY(180deg) scale(1.07)}
    30%{transform:rotateY(180deg) scale(.93)}45%{transform:rotateY(180deg) scale(1.05)}60%{transform:rotateY(180deg) scale(.96)}}
  .card:active{transform:scale(.95)}
  #panel.show{animation:panelPop .26s cubic-bezier(.34,1.56,.64,1)}
  @keyframes panelPop{from{transform:scale(.86)}to{transform:scale(1)}}
  .pet.tap{animation:petBounce .34s}
  @keyframes petBounce{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-12px) scale(1.14)}
    65%{transform:translateY(0) scale(.97)}}
  .pet.guide::after{content:'';position:absolute;inset:-10px;border-radius:50%;
    border:3px solid #fbbf24;animation:guidePulse 1.1s infinite;pointer-events:none}
  @keyframes guidePulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
  .spark{position:absolute;pointer-events:none;font-size:16px;z-index:80;
    animation:sparkFly .8s ease-out forwards}
  .food{position:absolute;pointer-events:none;font-size:26px;z-index:90;
    transform:translate(-50%,-50%);filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
  .levelBeam{position:absolute;width:76px;height:190px;z-index:50;pointer-events:none;
    transform:translate(-50%,100%);
    background:linear-gradient(to top, rgba(253,230,138,0), rgba(253,230,138,.85) 42%, rgba(255,255,255,0));
    border-radius:50% 50% 0 0;filter:blur(2px)}
  .winStamp{position:absolute;left:50%;top:50%;font-size:64px;font-weight:900;z-index:82;
    color:#fde68a;text-shadow:0 0 22px rgba(253,230,138,.9), 0 6px 14px rgba(0,0,0,.6);
    letter-spacing:4px;pointer-events:none;transform:translate(-50%,-50%)}
  @keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}
  .confetti{position:absolute;top:-8%;font-size:22px;z-index:70;pointer-events:none;
    animation:fallDown 1.5s ease-in forwards}
  @keyframes fallDown{to{transform:translateY(120vh) rotate(540deg);opacity:0}}
  .card.burst{animation:cardBurst .5s ease-out}
  @keyframes cardBurst{0%{transform:scale(1)}35%{transform:scale(1.18);filter:brightness(1.7)}
    100%{transform:scale(.92);filter:brightness(1)}}
  .fruitPop{position:absolute;font-size:44px;z-index:76;pointer-events:none;
    transform:translate(-50%,-50%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
  .goldRing{position:absolute;width:40px;height:40px;border-radius:50%;z-index:75;pointer-events:none;
    border:3px solid #fde68a;box-shadow:0 0 18px 4px rgba(253,230,138,.8);
    transform:translate(-50%,-50%)}
  /* ── 遊戲層（蓋住手冊，玩完再收）── */
  #playLayer{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;gap:8px;
    padding:12px;background:linear-gradient(170deg,rgba(13,22,42,.975),rgba(8,14,28,.995));
    animation:playIn .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes playIn{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  #playLayer .ghead{padding:0 2px}
  #playLayer .gsub{margin-left:10px}
  #playClose{margin-left:auto;appearance:none;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);color:#e2e8f0;border-radius:999px;width:34px;height:34px;
    font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;line-height:1}
  #playClose:active{transform:scale(.94)}
  #pgrid{flex:0 1 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    min-height:0;width:100%;max-width:680px;margin:auto auto 0;padding:4px 0;overflow:auto}
  #pgrid .card{width:100%;height:auto;aspect-ratio:1/1;align-self:center}
  #gmsg{text-align:center;font-size:15px;font-weight:900;color:#94a3b8;min-height:24px;
    padding:12px 0 6px;margin-bottom:auto}
  #gmsg.win{color:#fde68a;font-size:20px;text-shadow:0 0 16px rgba(253,230,138,.8)}
  #gamePane.slide-in{animation:gameSlide .45s cubic-bezier(.2,.8,.3,1)}
  @keyframes gameSlide{from{transform:translateX(34px);opacity:.35}to{transform:none;opacity:1}}
  /* 農場星星 */
  #farmStars{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;
    background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.15);border-radius:999px;
    padding:5px 12px;font-size:14px;font-weight:900;color:#fbbf24;z-index:8}
  #homeBtn{position:absolute;top:10px;right:52px;z-index:31;display:flex;align-items:center;
    justify-content:center;width:34px;height:34px;border-radius:11px;text-decoration:none;
    background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.18);font-size:16px;line-height:1;
    transition:transform .12s,background .12s}
  #homeBtn:hover{background:rgba(30,41,59,.95);transform:translateY(-1px)}
  #homeBtn:active{transform:scale(.94)}
  #farmStars button{border:none;border-radius:999px;background:#fbbf24;color:#0b1220;
    font-weight:900;font-size:12px;padding:3px 8px;cursor:pointer;font-family:inherit}

  /* 孩子的手冊 */
  #hbView{flex:1;position:relative;margin:8px;border-radius:14px;overflow:hidden;
    background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;min-height:0}
  #hbMain{max-width:100%;max-height:100%;object-fit:contain;display:none}
  #hbEmpty{color:#94a3b8;font-size:14px;text-align:center;line-height:2;padding:20px}
  #hbThumbs{display:flex;gap:6px;overflow-x:auto;padding:0 8px 6px;flex:0 0 auto}
  #hbThumbs::-webkit-scrollbar{height:6px}
  #hbThumbs::-webkit-scrollbar-thumb{background:#475569;border-radius:999px}
  .hbThumb{width:56px;height:56px;border-radius:10px;object-fit:cover;cursor:pointer;
    border:2px solid transparent;flex:0 0 auto;opacity:.75;transition:opacity .15s,border-color .15s}
  .hbThumb:hover{opacity:1}
  .hbThumb.on{border-color:#fbbf24;opacity:1}
  #hbBar{display:flex;gap:8px;padding:0 8px 10px;flex:0 0 auto}
  .hbBtn{flex:1;border:none;border-radius:12px;padding:10px;font-size:14px;font-weight:900;

  /* ── 音效（Web Audio 合成，零外部檔） ── */
  var AC = null;
  function ac(){
    if (!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function beep(freq, dur, type, vol){
    if (window.SND && !window.SND.on()) return;
    var a = ac(); if (!a) return;
    try{
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.1, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    }catch(e){}
  }
  function sfxFlip(){ beep(540, .06, 'triangle', .07); }
  function sfxMatch(){ beep(880, .1, 'sine', .11); setTimeout(function(){ beep(1320, .16, 'sine', .09); }, 90); }
  function sfxWrong(){ beep(160, .16, 'sawtooth', .09); }
  function sfxWin(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,.22,'triangle',.11); }, i*130); }); }
  function sfxLevel(){ [523,659,784,1047,1319].forEach(function(f,i){ setTimeout(function(){ beep(f,.3,'triangle',.13); }, i*85); }); }
  function sfxFeed(){ beep(420, .08, 'square', .07); setTimeout(function(){ beep(630, .12, 'square', .06); }, 80); }
  function sfxTap(){ beep(320, .05, 'sine', .06); }

  /* ── 記憶翻牌 ── */
  var game = { cards: [], first: null, lock: false, petId: 0, won:false };
  var cardEls = [];

  function startGame(id){
    if (!pgrid || !playLayer) return;
    playLayer.classList.remove('hidden');
    var p = pets[id];
    game.petId = id;
    game.first = null;
    game.lock = false;
    game.won = false;
    if (p.stage === 0){
      game.cards = [];
      renderGame();
      return;
    }
    var pairs = FORMS[p.stage].pairs;
    var faces = FACE.slice(0, pairs);
    var deck = [];
    faces.forEach(function(f, idx){
      deck.push({pairId:idx, face:f});
      deck.push({pairId:idx, face:f});
    });
    for (var i=deck.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    game.cards = deck.map(function(c){
      return {pairId:c.pairId, face:c.face, flipped:false, matched:false};
    });
    renderGame();
  }

  function renderGame(){
    if (!pgrid) return;
    var p = pets[game.petId];
    var gmsgEl = gmsg;
    if (!p){ pgrid.innerHTML=''; return; }
    if (p.stage === 0){
      gameTitle.textContent = p.name + ' 🥚';
      gameSub.textContent = '';
      pgrid.innerHTML = '';
      pgrid.style.gridTemplateColumns = '1fr';
      gmsgEl.textContent = '🥚 先餵食';
      gmsgEl.classList.remove('win');
      return;
    }
    var pairs = FORMS[p.stage].pairs;
    gameTitle.textContent = '🎮 ' + p.name + ' 來了！· ' + pairs + ' 對';
    gameSub.textContent = '贏了才長大';
    var cols = (pairs===10) ? 5 : 4;
    pgrid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
    pgrid.innerHTML = '';
    cardEls = [];
    game.cards.forEach(function(c, idx){
      var el = document.createElement('div');
      el.className = 'card' + (c.flipped?' flipped':'') + (c.matched?' matched':'');
      el.innerHTML = '<div class="inner"><span class="back">?</span><span class="face">'+c.face+'</span></div>';
      el.style.animationDelay = (idx*28) + 'ms';
      el.addEventListener('click', function(){ flipCard(idx); });
      pgrid.appendChild(el);
      cardEls.push(el);
    });
    gmsgEl.classList.remove('win');
    if (!game.cards.some(function(c){ return c.matched; })){
      gmsgEl.textContent = p.won[p.stage] ? '✅ 餵食升級' : '👀 找一樣';
    }
  }

  function flipCard(i){
    if (game.lock) return;
    var c = game.cards[i];
    if (!c || c.flipped || c.matched) return;
    c.flipped = true;
    cardEls[i].classList.add('flipped');
    sfxFlip();
    if (game.first === null){
      game.first = i;
      return;
    }
    var fi = game.first;
    var a = game.cards[fi], b = game.cards[i];
    if (a.pairId === b.pairId){
      a.matched = b.matched = true;
      game.first = null;
      cardEls[fi].classList.add('matched','burst');
      cardEls[i].classList.add('matched','burst');
      fruitPop(a.pairId, cardEls[i]);
      sparkBurst(cardEls[i]);
      sfxMatch();
      if (game.cards.every(function(x){ return x.matched; })) winGame();
    } else {
      game.lock = true;
      cardEls[fi].classList.add('wrong');
      cardEls[i].classList.add('wrong');
      sfxWrong();
      setTimeout(function(){
        cardEls[fi].classList.remove('flipped','wrong');
        cardEls[i].classList.remove('flipped','wrong');
        game.cards[fi].flipped = false;
        game.cards[i].flipped = false;
        game.first = null;
        game.lock = false;
      }, 820);
    }
  }

  function winGame(){
    var p = pets[game.petId];
    p.won[p.stage] = true;
    game.won = true;
    /* 贏一局另外送星星（星星不值錢，重點是「贏了」那一下） */
    stars += WIN_STARS;
    starEl.textContent = stars;
    saveStars();
    gmsg.textContent = '🎉 贏了！+' + WIN_STARS + '⭐' + (p.stage<4 ? ' 餵食長大' : '');
    gmsg.classList.add('win');
    showWinStamp();
    cheer(p,'🎉');
    confetti();
    sfxWin();
    checkUpgrade(p);
    renderPetBar();
    if (active === p.id) refreshPanel();
  }

  function showWinStamp(){
    var st = document.createElement('div');
    st.className = 'winStamp';
    st.textContent = 'WIN!';
    document.getElementById('gamePane').appendChild(st);
    if (st.animate){
      st.animate([
        {transform:'translate(-50%,-50%) scale(.2) rotate(-12deg)', opacity:0},
        {transform:'translate(-50%,-50%) scale(1.15) rotate(-6deg)', opacity:1, offset:.35},
        {transform:'translate(-50%,-50%) scale(1) rotate(-6deg)', opacity:1, offset:.7},
        {transform:'translate(-50%,-50%) scale(1.6) rotate(-6deg)', opacity:0}
      ], {duration:1400, easing:'ease-out'});
    }
    (function(x){ setTimeout(function(){ if (x.parentNode) x.parentNode.removeChild(x); }, 1450); })(st);
  }

  /* ── 升級 ── */
  function checkUpgrade(p){
    if (p.stage === 0){
      if (p.growth >= HATCH_AT){ var h0 = p.stage; p.stage = 1; hatchFx(p, h0); return true; }
      return false;
    }
    var f = formOf(p);
    if (p.stage < 4 && p.growth >= f.next && p.won[p.stage]){
      var from = p.stage;
      p.stage++;
      levelUpFx(p, from);
      return true;
    }
    return false;
  }
  /* 升級／孵化的儀式：全螢幕，強度對齊戰鬥特效 */
  function levelUpFx(p, fromStage){ ceremony(p, fromStage); }
  function hatchFx(p, fromStage){ ceremony(p, fromStage); }

  var ceremonyBusy = false;

  function ceremonyConfetti(){
    var emo = ['🎉','⭐','✨','🎊','🌟'];
    for (var k = 0; k < 34; k++){
      (function(kk){
        var c = document.createElement('div');
        c.textContent = emo[kk % emo.length];
        c.style.cssText = 'position:fixed;z-index:90;pointer-events:none;left:' +
          (window.innerWidth / 2 + (Math.random() - .5) * 240) + 'px;top:' +
          (window.innerHeight * 0.44) + 'px;font-size:' + (14 + Math.random() * 16) + 'px';
        document.body.appendChild(c);
        var dx = (Math.random() - .5) * 680, dy = -150 - Math.random() * 280;
        var rot = (Math.random() - .5) * 420;
        c.animate([
          { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
          { transform: 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(1) rotate(' + rot + 'deg)', opacity: 0 }
        ], { duration: 1500 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.4,1)' })
          .onfinish = function(){ if (c.parentNode) c.parentNode.removeChild(c); };
      })(k);
    }
  }

  /* 四拍：醞釀 → 白閃爆開 → 新形態登場 → 牠說話 */
  function ceremony(p, from){
    var el = document.getElementById('ceremony');
    if (!el){ updateVisual(p); return; }
    if (ceremonyBusy) return;
    ceremonyBusy = true;

    var to = Math.max(0, Math.min(4, from + 1));
    var isHatch = (from === 0);
    var img = el.querySelector('.cgImg');
    var rings = el.querySelectorAll('.cgRing');
    var flash = el.querySelector('.cgFlash');
    var title = el.querySelector('.cgTitle');
    var sub = el.querySelector('.cgSub');
    var timers = [];
    function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

    function finish(){
      timers.forEach(clearTimeout);
      timers.length = 0;
      el.classList.remove('on');
      ceremonyBusy = false;
      if (img.getAnimations) img.getAnimations().forEach(function(a){ a.cancel(); });
    }
    el.onclick = function(e){ e.stopPropagation(); finish(); };

    /* 儀式期間把面板收起來，畫面只留牠一個 */
    panel.classList.remove('show');
    active = null;

    img.src = formImg(p, from);
    if (img.getAnimations) img.getAnimations().forEach(function(a){ a.cancel(); });
    title.textContent = isHatch ? '🥚 孵化了！' : '✨ 進化了！';
    title.style.opacity = '0';
    sub.style.opacity = '0';
    sub.textContent = '';
    el.classList.add('on');

    /* 1) 醞釀：身體發光、抖一下、光環轉出來 */
    if (img.animate){
      img.animate([
        { transform: 'scale(.86) rotate(0deg)', filter: 'drop-shadow(0 0 18px rgba(251,191,36,.45)) brightness(1)' },
        { transform: 'scale(.92) rotate(-3deg)', filter: 'drop-shadow(0 0 44px rgba(251,191,36,.9)) brightness(1.3)', offset: .45 },
        { transform: 'scale(.88) rotate(3deg)', filter: 'drop-shadow(0 0 44px rgba(251,191,36,.9)) brightness(1.3)', offset: .6 },
        { transform: 'scale(1.04) rotate(0deg)', filter: 'drop-shadow(0 0 64px rgba(253,224,71,1)) brightness(1.75)' }
      ], { duration: 1150, easing: 'ease-in', fill: 'forwards' });
    }
    [].forEach.call(rings, function(r, i){
      if (!r.animate) return;
      r.animate([
        { opacity: 0, transform: 'scale(.5)' },
        { opacity: .95, transform: 'scale(1)', offset: .45 },
        { opacity: 0, transform: 'scale(1.55)' }
      ], { duration: 1450, delay: i * 170, easing: 'ease-out' });
    });
    sfxLevel();

    /* 2) 爆開：白閃 + 畫面震 + 換形態 */
    at(1150, function(){
      if (flash && flash.animate){
        flash.animate([{ opacity: .95 }, { opacity: 0 }], { duration: 540, easing: 'ease-out' });
      }
      var app = document.getElementById('app');
      if (app && app.animate){
        app.animate([
          { transform: 'translate(0,0)' }, { transform: 'translate(-9px,5px)' },
          { transform: 'translate(8px,-6px)' }, { transform: 'translate(-4px,3px)' },
          { transform: 'translate(0,0)' }
        ], { duration: 440 });
      }
      img.src = formImg(p, to);
      if (img.getAnimations) img.getAnimations().forEach(function(a){ a.cancel(); });
      if (img.animate){
        img.animate([
          { transform: 'scale(.35)', opacity: 0, filter: 'drop-shadow(0 0 70px rgba(255,255,255,1)) brightness(2.2)' },
          { transform: 'scale(1.24)', opacity: 1, filter: 'drop-shadow(0 0 60px rgba(253,224,71,1)) brightness(1.5)', offset: .55 },
          { transform: 'scale(1)', opacity: 1, filter: 'drop-shadow(0 0 34px rgba(251,191,36,.8)) brightness(1)' }
        ], { duration: 860, easing: 'cubic-bezier(.2,.9,.3,1.3)', fill: 'forwards' });
      }
      ceremonyConfetti();
    });

    /* 3) 標題 + 形態變化 */
    at(1560, function(){
      if (title.animate){
        title.animate([{ opacity: 0, transform: 'translateY(14px)' },
          { opacity: 1, transform: 'translateY(0)' }], { duration: 420, fill: 'forwards' });
      }
      sub.textContent = STAGE_NAMES[from] + '  →  ' + STAGE_NAMES[to];
      if (sub.animate){
        sub.animate([{ opacity: 0, transform: 'translateY(10px)' },
          { opacity: 1, transform: 'translateY(0)' }], { duration: 380, fill: 'forwards' });
      }
    });

    /* 4) 牠說話（這句一輩子只出現一次） */
    at(2350, function(){
      var line = petLine(p, isHatch ? 'hatch' : 'evolve', { force: true });
      if (!line) return;
      sub.textContent = line;
      if (sub.animate){
        sub.animate([{ opacity: 0, transform: 'translateY(10px) scale(.96)' },
          { opacity: 1, transform: 'translateY(0) scale(1)' }], { duration: 420, fill: 'forwards' });
      }
    });

    at(4900, finish);
  }

  function upgradeBlockText(p){
    if (p.stage === 0) return '';
    var f = formOf(p);
    if (p.stage >= 4) return '已滿級';
    if (p.growth >= f.next && !p.won[p.stage]) return '⚠️ 先玩一局';
    return '';
  }

  /* 成長進度條：讓小孩看得見「還要餵幾次」 */
  function paintProgress(p){
    var BASE = [0,10,30,70,120];
    var f = formOf(p);
    if (p.stage >= 4){
      pBarFill.style.width = '100%';
      pProgTxt.textContent = '🐲 已滿級';
      return;
    }
    var next = f.next;
    var pct = Math.max(0, Math.min(100, p.growth / next * 100));
    pBarFill.style.width = pct.toFixed(0) + '%';
    var remain = Math.max(0, next - p.growth);
    /* 升級靠星星：把「還要幾顆星」講清楚，不是抽象的次數 */
    if (remain > 0){
      pProgTxt.textContent = '⭐ ' + p.growth + ' / ' + next + '（再 ' + remain + ' 顆星）';
    } else {
      pProgTxt.textContent = '⭐ ' + p.growth + ' / ' + next + '（夠了，去贏一局）';
    }
  }

  /* ── 面板 ── */
  function farmCount(){
    var n=0; pets.forEach(function(q){ if(q.inFarm) n++; }); return n;
  }

  function moodText(p){
    if (p.state==='hungry') return '🍖 肚子餓了';
    if (p.state==='bored')  return '🎾 想跟你玩';
    if (p.state==='sad')    return '😢 有點難過';
    return '😊 很開心';
  }

  /* 記住「現在的孩子王」，挑戰頁會用同一隻出場（階段升級後要跟著更新） */
  function savePet(p){
    try {
      localStorage.setItem('dsh_pet', JSON.stringify({
        k: SPECIES[p.species].id,
        s: p.stage,
        n: SPECIES[p.species].names[p.stage],
        no: p.species + 1
      }));
    } catch(e){}
  }

  function openPanel(id){
    active = id;
    var p = pets[id];
    var hint = document.getElementById('farmHint');
    if (hint) hint.style.opacity = '0';
    /* 對話泡泡會壓到面板上，開面板時先收掉 */
    var says = document.querySelectorAll('.petsay');
    for (var si = 0; si < says.length; si++) says[si].parentNode.removeChild(says[si]);
    savePet(p);
    if (id === 0) pets[0].el.classList.remove('guide');
    panel.classList.add('show');
    pName.textContent = SPECIES[p.species].names[p.stage];
    pForm.textContent = p.name + ' · ' + formOf(p).name + (p.inFarm?' · 🏡':'');
    var block = upgradeBlockText(p);
    pMood.textContent = moodText(p) + (block ? '　' + block : '');
    paintProgress(p);
    pAvatar.src = formOf(p).img;
    pAvatar.style.filter = p.state==='sad'?'grayscale(.8) brightness(.75)':'';
    /* 星星夠把進度餵滿 → 餵食鍵變成「進化鍵」，直接去挑戰高難度 */
    var canEvolve = (p.stage < 4) && (stars >= Math.max(0, FORMS[p.stage].next - p.growth));
    evolveMode = canEvolve;
    btnFeed.classList.toggle('evolve', canEvolve);
    if (canEvolve){
      btnFeed.disabled = false;
      btnFeed.textContent = p.stage === 0 ? '⚡ 孵化挑戰！'
        : (p.won[p.stage] ? '⚡ 進化！' : '⚡ 進化挑戰！');
    } else {
      btnFeed.disabled = stars < 1;
      btnFeed.textContent = (p.stage===0)
        ? '🥚 '+p.growth+'/'+HATCH_AT
        : '🍖 1⭐';
    }
    if (p.stage === 0){
      btnGame.textContent = '🥚 先餵食孵化';
      btnGame.disabled = true;
    } else {
      btnGame.textContent = '🎮 和我玩';
      btnGame.disabled = false;
    }
    btnPlay.classList.toggle('hidden', p.state!=='bored');
    btnComfort.classList.toggle('hidden', p.state!=='sad');
    if (p.stage >= 1 && !p.inFarm){
      btnToggle.classList.remove('hidden');
      btnToggle.textContent = '🏡 放入農場 '+farmCount()+'/'+FARM_MAX;
      btnToggle.disabled = farmCount() >= FARM_MAX;
    } else if (p.inFarm){
      btnToggle.classList.remove('hidden');
      btnToggle.textContent = '🏠 召回寵物欄';
      btnToggle.disabled = false;
    } else {
      btnToggle.classList.add('hidden');
    }
    /* 時間換星星：有 ≥5 分鐘娛樂時間才給入口（單向，星星換不回時間） */
    if (window.Time && btnTrade){
      var bal = window.Time.balance();
      if (bal >= window.Time.starCost()){
        btnTrade.classList.remove('hidden');
        btnTrade.disabled = false;
      } else {
        btnTrade.classList.add('hidden');
      }
    }
    positionPanel();
  }
  function positionPanel(){
    if (active === null) return;
    var pw = panel.offsetWidth || 240;
    var ph = panel.offsetHeight || 340;
    var fw = farmPane.clientWidth;
    var fh = farmArea.clientHeight || (farmPane.clientHeight - 96);
    var p = pets[active];
    /* 面板浮在寵物頭上；大隻的寵物（高階）要抬得更高 */
    var boxW = (p && p.el && p.el.offsetWidth) ? p.el.offsetWidth : 96;
    var grow = (p && STAGE_GROW[p.stage]) ? STAGE_GROW[p.stage] : 1;
    var visH = boxW * grow;
    var cx = (p && typeof p.x === 'number' ? p.x : fw/2 - 48) + boxW/2;
    var cy = (p && typeof p.y === 'number' ? p.y : fh*0.72);
    var left = Math.round(cx - pw/2);
    var headY = Math.round(cy + boxW - visH);        /* 寵物視覺上的頭頂 */
    var top = headY - ph - 10;
    if (top < 8) top = Math.round(cy + boxW + 10);   /* 頭上沒空間 → 改到腳下 */
    left = Math.max(8, Math.min(left, fw - pw - 8));
    top = Math.max(8, Math.min(top, fh - ph - 8));
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  }
  function refreshPanel(){ if (active!==null) openPanel(active); }

  function resetNeed(p){
    p.state='idle'; p.needAge=0;
    p.needTimer = GAP_MIN + Math.random()*(GAP_MAX-GAP_MIN);
    p.el.classList.remove('show-bubble');
  }

  /* 寵物說話：文字來自 petlang.js（依成長階段給不同說法） */
  function petLine(p, key, opts){
    if (!window.PetSay) return '';
    return window.PetSay.speak(key, p.stage, opts) || '';
  }

  function cheer(p, text, ms){
    if (!text) return;
    p.bubble.textContent = text;
    /* 純 emoji 用小氣泡，文字用對話泡泡 */
    p.bubble.classList.toggle('emoji', text.length <= 2);
    p.el.classList.add('show-bubble');
    p.el.animate([{transform:'translateY(0)'},{transform:'translateY(-10px)'},{transform:'translateY(0)'}],
      {duration:400, easing:'ease-out'});
    clearTimeout(p._bubbleT);
    var hold = ms || (window.PetSay ? window.PetSay.holdMs(text) : 3500);
    p._bubbleT = setTimeout(function(){ p.el.classList.remove('show-bubble'); }, hold);
  }

  /* 給頁面上其他區塊（家長設定）叫農場裡的寵物說話用 */
  window.__petCheer = function (text) { if (pets[0]) cheer(pets[0], text); };

  function placeInFarm(p){
    var m = 36;
    p.x = m + Math.random()*Math.max(40, fw - m*2 - 64);
    p.y = Math.round(fh*0.68 + Math.random()*Math.max(20, fh*0.20));
    p.tx = p.x; p.ty = p.y;
    p.el.style.left = p.x+'px';
    p.el.style.top = p.y+'px';
  }

  function updateVisual(p){
    var f = formOf(p);
    p.img.src = f.img;
    var fl = [];
    if (p.stage === 0 && p.hue) fl.push('hue-rotate('+p.hue+'deg)');
    p.img.style.filter = fl.join(' ');
    p.el.classList.toggle('sad', p.state==='sad');
    var excited = (f.next!==Infinity) && (p.growth >= f.next*0.8) && p.state!=='sad';
    p.el.classList.toggle('excited', excited);
    p.el.style.display = p.inFarm ? '' : 'none';
  }

  /* ── 按鈕 ── */
  document.getElementById('btnStar').addEventListener('click', function(){
    stars++; starEl.textContent=stars; saveStars(); refreshPanel();
  });

  btnFeed.addEventListener('click', function(){
    if (active===null) return;
    var p = pets[active];
    /* 進化鍵：星星直接餵滿 → 帶牠去打高難度那一場 */
    if (evolveMode){
      var need = Math.max(0, FORMS[p.stage].next - p.growth);
      if (stars < need) return;
      stars -= need; starEl.textContent = stars; saveStars();
      p.growth += need;
      savePet(p);
      updateVisual(p);
      refreshPanel();
      renderPetBar();
      cheer(p, '我要變強！', 2400);
      sfxLevel();
      if (window.Juice) window.Juice.fx('unlock');
      try {
        localStorage.setItem('dsh_evolve', JSON.stringify({
          k: SPECIES[p.species].id, s: p.stage, no: p.species + 1, n: NAMES[p.species][p.stage]
        }));
      } catch (e) {}
      setTimeout(function(){ location.href = 'challenge.html?evolve=1'; }, 850);
      return;
    }
    if (stars<1) return;
    stars--; starEl.textContent=stars; saveStars();
    p.growth++;
    feedFx(p);
    sfxFeed();
    var upgraded = checkUpgrade(p);
    savePet(p);
    if (upgraded){
      /* 升級／孵化的台詞交給 levelUpFx / hatchFx 講 */
    } else if (p.stage>0){
      var f=formOf(p);
      if (p.growth>=f.next && !p.won[p.stage]) cheer(p,'💡');
      else cheer(p, petLine(p,'fed'), 3200);
    } else cheer(p,'❤');
    if (p.state==='hungry') resetNeed(p);
    updateVisual(p);
    refreshPanel();
    renderPetBar();
  });

  btnGame.addEventListener('click', function(){
    if (active === null) return;
    var p = pets[active];
    if (p.stage === 0){ sfxWrong(); return; }
    sel = active; renderPetBar();
    sfxTap();
    /* 1) 收起面板，視覺乾淨 */
    panel.classList.remove('show');
    active = null;
    /* 2) 寵物衝向遊戲區（右緣） */
    var fw2 = farmArea.clientWidth || 512;
    var dx = Math.max(90, Math.min(240, fw2 - p.x - 76));
    if (p.el && p.el.animate){
      p.el.animate([
        {transform:'translate(0,0)'},
        {transform:'translate('+(dx*0.5)+'px,-20px)', offset:.45},
        {transform:'translate('+dx+'px,0)'}
      ], {duration:850, easing:'ease-in-out'});
    }
    /* 3) 到達後進遊樂場（下棋的地方） */
    setTimeout(function(){
      savePet(p);
      window.location.href = 'playground.html';
    }, 800);
  });

  btnQuiz.addEventListener('click', function(){
    if (active === null) return;
    var p = pets[active];
    sel = active; renderPetBar();
    sfxTap();
    /* 收起面板，寵物往左衝（去戰場） */
    panel.classList.remove('show');
    active = null;
    var fw2 = farmArea.clientWidth || 512;
    var dx = Math.max(90, Math.min(240, p.x - 40));
    if (p.el && p.el.animate){
      p.el.animate([
        {transform:'translate(0,0)'},
        {transform:'translate('+(-dx*0.5)+'px,-20px)', offset:.45},
        {transform:'translate('+(-dx)+'px,0)'}
      ], {duration:850, easing:'ease-in-out'});
    }
    setTimeout(function(){
      savePet(p);
      window.location.href = 'challenge.html';
    }, 800);
  });

  btnPlay.addEventListener('click', function(){
    if (active===null) return;
    var p=pets[active]; cheer(p,'🎾'); resetNeed(p); updateVisual(p); refreshPanel(); renderPetBar();
  });

  btnComfort.addEventListener('click', function(){
    if (active===null) return;
    var p=pets[active]; cheer(p,'❤'); resetNeed(p); updateVisual(p); refreshPanel(); renderPetBar();
  });

  btnToggle.addEventListener('click', function(){
    if (active===null) return;
    var p=pets[active];
    if (p.inFarm){
      p.inFarm=false; p.el.style.display='none'; cheer(p,'🏠');
    } else {
      if (farmCount()>=FARM_MAX) return;
      p.inFarm=true; placeInFarm(p); p.el.style.display=''; cheer(p,'🏡');
    }
    updateVisual(p); refreshPanel(); renderPetBar();
  });

  btnTrade.addEventListener('click', function(){
    if (!window.Time) return;
    var got = window.Time.toStars(window.Time.starCost());
    if (!got) return;
    stars += got; saveStars();
    starEl.textContent = stars;
    sfxMatch();
    cheer(pets[active===null?0:active], '✨+' + got);
    refreshPanel(); renderPetBar();
  });

  /* 點面板以外的任何地方 → 關閉面板（不需要關閉鍵） */
  document.addEventListener('click', function(e){
    if (!panel.classList.contains('show')) return;
    if (panel.contains(e.target)) return;
    var el = e.target;
    if (!el || !el.closest) return;
    /* 點到的元素可能已經被重新 render 掉（例如寵物條 chip）→ 不算「點到外面」 */
    if (!el.isConnected) return;
    /* 點底部寵物條 → 那是「換一隻」的指令，不要關掉剛開的面板 */
    if (el.closest('#petBar')) return;
    if (el.closest('.pet')) return;
    panel.classList.remove('show'); active = null;
  });

  /* 收起遊戲層 */
  if (playClose) playClose.addEventListener('click', function(){
    sfxTap();
    playLayer.classList.add('hidden');
    game.cards = [];
    cardEls = [];
  });

  /* ── 主循環 ── */
  var last = performance.now();
  function tick(now){
    var dt = Math.min(now-last, 60); last=now;
    for (var i=0;i<pets.length;i++){
      var p=pets[i];
      if (!p.inFarm) continue;

      if (p.state==='idle'){
        p.needTimer -= dt;
        if (p.needTimer<=0){
          p.state = Math.random()<0.55?'hungry':'bored';
          p.needAge=0;
          cheer(p, petLine(p, p.state==='hungry'?'hungry':'bored'));
          sfxNeed();
          updateVisual(p);
          if (p.id===active) refreshPanel();
          renderPetBar();
        }
      } else if (p.state==='hungry'||p.state==='bored'){
        p.needAge += dt;
        if (p.needAge >= NEED_TIMEOUT){
          p.state='sad';
          cheer(p, petLine(p, 'sad'));
          updateVisual(p);
          if (p.id===active) refreshPanel();
          renderPetBar();
        }
      }

      /* 面板開著的寵物先站好，別讓面板跟牠跑掉 */
      if (p.id === active) continue;

      if (p.wait>0){ p.wait -= dt; continue; }
      var dx=p.tx-p.x, dy=p.ty-p.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if (dist<4){
        p.wait = 900 + Math.random()*2600;
        /* 越長越大：大隻的留給牠更多空間，免得走出畫面 */
        var grow = STAGE_GROW[p.stage] || 1;
        var spanX = Math.max(40, fw - 140 - 70 * (grow - 1));
        p.tx = 36 + Math.random()*spanX;
        p.ty = Math.round(fh*0.68 + Math.random()*Math.max(20, fh*0.20));
      } else {
        var speed=0.06*dt;
        p.x += dx/dist*Math.min(speed,dist);
        p.y += dy/dist*Math.min(speed,dist);
      }
      p.el.style.left = p.x+'px';
      p.el.style.top = p.y+'px';
      p.el.style.zIndex = Math.round(p.y*10);
      var yPct = p.y / fh * 100;
      var t = Math.max(0, Math.min(1, (yPct - 68) / 20));
      p.el.style.transform = 'scale(' + ((0.82 + 0.18 * t) * (STAGE_GROW[p.stage] || 1)).toFixed(3) + ')';
      var hueStr = (p.stage === 0 && p.hue) ? 'hue-rotate('+p.hue+'deg) ' : '';
      p.img.style.filter = hueStr
        + 'saturate(' + (0.92 + 0.13 * t).toFixed(2) + ')'
        + ' brightness(' + (1.04 - 0.05 * t).toFixed(2) + ')'
        + ' drop-shadow(0 4px 4px rgba(0,0,0,.18))';
    }
    requestAnimationFrame(tick);
  }

  /* ── 打贏怪＝贏一局：挑戰頁的戰績帶回這裡，解鎖這個階段的進化 ── */
  (function(){
    var w = null;
    try { w = JSON.parse(localStorage.getItem('dsh_won') || 'null'); } catch(e){}
    if (!w || !w.k) return;
    pets.forEach(function(p){
      if (SPECIES[p.species].id === w.k && p.stage === w.s) p.won[p.stage] = true;
    });
  })();

  /* ── 首次選蛋：確認框 + 開場儀式 ── */
  function askPick(spIdx){
    if (pickBusy || !picking) return;
    if (pickedSet.indexOf(spIdx) >= 0) return;
    pickCur = spIdx;
    pickBusy = true;
    sfxTap();
    var sp = SPECIES[spIdx];
    document.getElementById('pickEgg').src = 'pets/' + sp.id + '/01_蛋.webp';
    document.getElementById('pickName').textContent = sp.names[0];
    document.getElementById('pickSub').textContent = sp.name + ' · 養到滿級是「' + sp.names[4] + '」';
    document.getElementById('pickMask').classList.remove('hidden');
  }
  function pickConfirm(){
    document.getElementById('pickMask').classList.add('hidden');
    pickBusy = false;
    if (pickCur < 0) return;
    if (pickedSet.indexOf(pickCur) < 0) pickedSet.push(pickCur);
    sfxMatch();
    if (pickedSet.length >= 2){
      startOpening(pickedSet[0], pickedSet[1]);
    } else {
      var g = document.getElementById('pickGuide');
      if (g) g.textContent = '選得好！再選 1 顆吧（1/2）';
      renderPetBar();
    }
  }
  function pickCancel(){
    document.getElementById('pickMask').classList.add('hidden');
    pickBusy = false;
    pickCur = -1;
  }
  function openingConfetti(){
    var emo = ['🎉','⭐','✨','🎊','🌟','🥚','💫'];
    for (var k = 0; k < 46; k++){
      (function(kk){
        var c = document.createElement('div');
        c.textContent = emo[kk % emo.length];
        c.style.cssText = 'position:fixed;z-index:9996;pointer-events:none;left:' +
          (window.innerWidth / 2 + (Math.random() - .5) * 200) + 'px;top:' +
          (window.innerHeight * 0.4) + 'px;font-size:' + (16 + Math.random() * 18) + 'px';
        document.body.appendChild(c);
        var dx = (Math.random() - .5) * 760, dy = -160 - Math.random() * 320;
        var rot = (Math.random() - .5) * 520;
        c.animate([
          { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
          { transform: 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(1) rotate(' + rot + 'deg)', opacity: 0 }
        ], { duration: 1500 + Math.random() * 1000, easing: 'cubic-bezier(.2,.7,.4,1)' })
          .onfinish = function(){ if (c.parentNode) c.parentNode.removeChild(c); };
      })(k);
    }
  }
  function startOpening(a, b){
    var ov = document.getElementById('opening');
    if (!ov) return;
    pickBusy = true;
    /* 先寫檔：就算中途關掉也算選好了 */
    try { localStorage.setItem(PICK_KEY, JSON.stringify([a, b])); } catch(e){}
    sfxLevel();
    ov.classList.add('on');
    document.getElementById('opEggA').src = 'pets/' + SPECIES[a].id + '/01_蛋.webp';
    document.getElementById('opEggB').src = 'pets/' + SPECIES[b].id + '/01_蛋.webp';
    document.getElementById('opNameA').textContent = SPECIES[a].names[0];
    document.getElementById('opNameB').textContent = SPECIES[b].names[0];
    openingConfetti();
    setTimeout(openingConfetti, 900);
    setTimeout(function(){ ov.classList.remove('on'); location.reload(); }, 3600);
  }

  /* ── 收成回扣：從挑戰頁帶回星星／分鐘 ── */
  var BACK_KEY = 'dsh_back';
  var harvest = null;
  try {
    var rawBack = localStorage.getItem(BACK_KEY);
    if (rawBack) {
      var hb = JSON.parse(rawBack);
      localStorage.removeItem(BACK_KEY);
      if (hb && (Date.now() - (hb.t || 0)) < 10*60*1000 && (hb.s || hb.m || hb.w)) harvest = hb;
    }
  } catch (e) { harvest = null; }

  function harvestShow(){
    var el = document.getElementById('harvest');
    if (!el || !harvest) return;
    var p = pets[0];
    if (harvest.k) { pets.forEach(function (q) { if (SPECIES[q.species].id === harvest.k) p = q; }); }

    var img = document.getElementById('hvPet');
    var title = document.getElementById('hvTitle');
    var count = document.getElementById('hvCount');
    var sub = document.getElementById('hvSub');
    var glow = el.querySelector('.hvGlow');

    img.src = formImg(p, p.stage);
    var earned = Math.max(0, (harvest.s || 0) + (harvest.b || 0));
    title.textContent = harvest.w ? '🎉 打贏了！' : '🎒 收成';
    count.textContent = '⭐ 0';
    sub.textContent = '';
    el.classList.add('on');
    sfxLevel();

    if (img.animate){
      img.animate([
        { transform:'translateY(70px) scale(.5)', opacity:0 },
        { transform:'translateY(-12px) scale(1.07)', opacity:1, offset:.62 },
        { transform:'translateY(0) scale(1)', opacity:1 }
      ], { duration:600, easing:'cubic-bezier(.2,.9,.3,1.4)' });
    }
    if (glow && glow.animate){
      glow.animate([{opacity:0},{opacity:1,offset:.45},{opacity:0}], { duration:1600, iterations:2 });
    }
    if (title.animate) title.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}], {duration:420,delay:180,fill:'forwards'});
    if (count.animate) count.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}], {duration:380,delay:340,fill:'forwards'});

    /* 星星從牠身上飛到計數器 */
    var n = earned > 0 ? Math.min(12, earned) : 0;
    var shown = 0;
    function bump(v){
      shown = v;
      count.innerHTML = '<span class="hvStar">⭐</span><span class="hvNum">' + shown + '</span>';
      count.classList.remove('pop'); void count.offsetWidth; count.classList.add('pop');
      sfxTap();
    }
    for (var i = 0; i < n; i++){
      (function (i) {
        setTimeout(function () {
          var st = document.createElement('div');
          st.className = 'hvFly';
          st.textContent = '⭐';
          var ir = img.getBoundingClientRect();
          var cr = count.getBoundingClientRect();
          var sx = ir.left + ir.width/2 + (Math.random()*70 - 35);
          var sy = ir.top + ir.height*0.42 + (Math.random()*50 - 25);
          st.style.left = sx + 'px';
          st.style.top = sy + 'px';
          document.body.appendChild(st);
          var dx = (cr.left + cr.width/2) - sx;
          var dy = (cr.top + cr.height/2) - sy;
          function land(){
            if (st.parentNode) st.parentNode.removeChild(st);
            bump(Math.min(earned, Math.round(earned * (i+1) / n)));
          }
          if (st.animate){
            st.animate([
              { transform:'translate(0,0) scale(.4)', opacity:0 },
              { transform:'translate(' + (dx*0.18) + 'px,' + (dy*0.18 - 80) + 'px) scale(1.3)', opacity:1, offset:.42 },
              { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.5)', opacity:.95 }
            ], { duration:780, easing:'cubic-bezier(.4,.1,.3,1)' }).onfinish = land;
          } else land();
        }, 380 + i * 105);
      })(i);
    }

    /* 收尾：講一句、顯示分鐘 */
    var tailAt = n ? (380 + (n-1)*105 + 820) : 600;
    setTimeout(function () {
      bump(earned);
      var bits = [];
      if (harvest.s) bits.push('+' + harvest.s + ' 顆星');
      if (harvest.b) bits.push('挑戰獎勵 +' + harvest.b + ' 顆');
      if (harvest.m) bits.push('+' + harvest.m + ' 分鐘');
      sub.textContent = bits.join('　');
      if (sub.animate) sub.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}], {duration:360,fill:'forwards'});
      var line = petLine(p, harvest.w ? 'win' : 'greet', { force: true });
      var say = document.getElementById('hvSay');
      if (line && say){
        say.textContent = line;
        if (say.animate) say.animate(
          [{opacity:0, transform:'translate(-50%, 8px) scale(.86)'},
           {opacity:1, transform:'translate(-50%, 0) scale(1)'}],
          {duration:320, fill:'forwards'});
      }
    }, tailAt);

    if (harvest.w) {
      setTimeout(function () {
        sub.textContent = '🎉 打贏了 ' + harvest.w + ' 場！星星夠就可以進化囉';
        if (sub.animate) sub.animate([{opacity:0},{opacity:1}], {duration:300,fill:'forwards'});
      }, tailAt + 1400);
    }

    var closed = false;
    function close(){ if (closed) return; closed = true; el.classList.remove('on'); }
    el.addEventListener('click', close);
    setTimeout(close, tailAt + (harvest.w ? 2900 : 1900));
  }

  /* ── 初始化 ── */
  if (picking){
    /* 選蛋模式：農場空著，引導小孩看下面的蛋 */
    var hint = document.getElementById('farmHint');
    if (hint) hint.style.opacity = '0';
    pets.forEach(function(p){ p.el.style.display = 'none'; });
    renderPetBar();
    var pg = document.getElementById('pickGuide');
    if (pg) pg.classList.remove('hidden');
    if (playLayer) playLayer.classList.add('hidden');
    if (gameTitle) gameTitle.textContent = '🥚 選兩顆蛋';
    if (gameSub) gameSub.textContent = '挑 2 顆你喜歡的';
    if (gmsg) gmsg.textContent = '👆 點下面的蛋，牠會跟你回家';
    document.getElementById('pickOk').addEventListener('click', pickConfirm);
    document.getElementById('pickNo').addEventListener('click', pickCancel);
  } else {
    pets.forEach(function(p){
      updateVisual(p);
      if (p.inFarm){ placeInFarm(p); p.el.style.display=''; }
    });
    renderPetBar();
    pets[0].el.classList.add('guide');
    if (playLayer) playLayer.classList.add('hidden');
    if (gameTitle) gameTitle.textContent = '🎪 寵物遊樂場';
    if (gameSub) gameSub.textContent = '';
    if (gmsg) gmsg.textContent = '👆 點一隻寵物，牠會跑過來跟你玩';
  }
  starEl.textContent = stars;
  requestAnimationFrame(tick);

  /* 從挑戰頁回來 → 演「帶回家」那一段 */
  if (harvest && !picking) setTimeout(harvestShow, 700);

  /* 剛打完進化挑戰（?evolve=1 那場）→ 讓牠真的變身 */
  (function () {
    var pending = null, done = false;
    try { pending = JSON.parse(localStorage.getItem('dsh_evolve') || 'null'); } catch (e) {}
    try { done = localStorage.getItem('dsh_evolve_done') === '1'; } catch (e) {}
    if (!pending || !done) return;
    try {
      localStorage.removeItem('dsh_evolve');
      localStorage.removeItem('dsh_evolve_done');
    } catch (e) {}
    setTimeout(function () {
      for (var i = 0; i < pets.length; i++) {
        var p = pets[i];
        if (SPECIES[p.species].id !== pending.k || p.stage !== pending.s) continue;
        p.growth = Math.max(p.growth, FORMS[p.stage].next);
        p.won[p.stage] = true;
        savePet(p);
        checkUpgrade(p);
        updateVisual(p);
        refreshPanel();
        renderPetBar();
        break;
      }
    }, 1100);
  })();

  /* 開頁先問雲端有沒有更新的存檔（換機／清快取後靠這個救回來）
     注意：選蛋階段也要問 —— 換機時還沒有 dsh_pick，正是最需要救回來的時候 */
  if (window.Player) {
    window.Player.hydrate(function (err, changed) {
      if (changed) setTimeout(function () { location.reload(); }, 260);
    });
  }

  /* 音效開關：貼在農場右上角 */
  if (window.SND) {
    window.SND.mount(farmArea, 'position:absolute;top:10px;right:10px;z-index:30');
    window.SND.bgm('prontera.mp3', 0.28, { start: 6.4 });
  }

  /* 偶爾自己蹦一下（隨機 5–11 秒），讓農場看起來有生命 */
  (function hopLoop() {
    setTimeout(function () {
      try {
        var cands = pets.filter(function (p) { return p.inFarm && p.el && p.stage > 0; });
        if (cands.length) {
          var p = cands[(Math.random() * cands.length) | 0];
          var im = p.el.querySelector('img');
          if (im && !im.classList.contains('hop')) {
            im.classList.add('hop');
            setTimeout(function () { im.classList.remove('hop'); }, 900);
          }
        }
      } catch (e) {}
      hopLoop();
    }, 5000 + Math.random() * 6000);
  })();

  /* 現在是哪一位小朋友：貼在農場左上角（星星下面） */
  if (window.Player && farmArea) {
    window.Player.mount(farmArea);
    var wc = document.getElementById('whoChip');
    if (wc) { wc.style.position = 'absolute'; wc.style.top = '52px'; wc.style.left = '10px'; wc.style.zIndex = '31'; wc.classList.add('alignLeft'); }
  }

  /* 娛樂時間：貼在農場左上角（人物下面） */
  if (window.Time && farmArea) {
    var tc = window.Time.mount(farmArea);
    tc.style.position = 'absolute';
    tc.style.top = '82px';
    tc.style.left = '10px';
    tc.style.zIndex = '31';
  }

  /* 一進來，寵物先跟你打招呼（一天只說得成一次，所以用 force） */
  setTimeout(function(){
    if (picking || harvest) return;
    var lead = pets[0];
    var h = new Date().getHours();
    cheer(lead, petLine(lead, (h>=20||h<6) ? 'night' : 'greet', { force:true }), 4200);
  }, 900);

  /* 測試鉤子：?autopanel=1 自動打開第一隻面板（驗證 popup 定位用） */
  try {
    if (new URLSearchParams(location.search).get('autopanel') === '1'){
      setTimeout(function(){
        if (pets[0].inFarm){ pets[0].y = Math.round(farmArea.clientHeight * 0.72); }
        openPanel(0);
      }, 600);
    }
    if (new URLSearchParams(location.search).get('autotest') === '1'){
      setTimeout(function(){
        if (!game.cards.length) startGame(0);
        setTimeout(function(){
          if (!game.cards.length) return;
          var pid = game.cards[0].pairId, j2 = -1;
          for (var j=1;j<game.cards.length;j++){ if (game.cards[j].pairId===pid){ j2=j; break; } }
          if (cardEls[0]) cardEls[0].click();
          setTimeout(function(){ if (j2>=0 && cardEls[j2]) cardEls[j2].click(); }, 420);
        }, 320);
      }, 700);
    }
    if (new URLSearchParams(location.search).get('autoplay') === '1'){
      setTimeout(function(){
        openPanel(0);
        setTimeout(function(){ if (!btnGame.disabled) btnGame.click(); }, 450);
      }, 700);
    }
    if (new URLSearchParams(location.search).get('autolevel') === '1'){
      setTimeout(function(){
        stars = 3; starEl.textContent = stars;
        pets[0].growth = 29; pets[0].won[1] = true;
        openPanel(0);
        setTimeout(function(){ btnFeed.click(); }, 420);
      }, 600);
    }
    /* 測試鉤子：?autohatch=1 蛋孵化（驗證孵化儀式） */
    if (new URLSearchParams(location.search).get('autohatch') === '1'){
      setTimeout(function(){
        stars = 3; starEl.textContent = stars;
        pets[0].stage = 0; pets[0].growth = 9;
        updateVisual(pets[0]); renderPetBar(); openPanel(0);
        setTimeout(function(){ btnFeed.click(); }, 420);
      }, 600);
    }
    if (new URLSearchParams(location.search).get('autowin') === '1'){
      setTimeout(function(){
        if (!game.cards.length) startGame(0);
        setTimeout(function(){ winGame(); }, 500);
      }, 700);
    }
  } catch(e){}
})();

/* ── 孩子的手冊（家長上傳照片）── */
(function () {
  var KEY = 'dsh_handbook';
  var file = document.getElementById('hbFile');
  var main = document.getElementById('hbMain');
  var empty = document.getElementById('hbEmpty');
  var thumbs = document.getElementById('hbThumbs');
  var count = document.getElementById('hbCount');
  var clearBtn = document.getElementById('hbClear');
  if (!file || !main) return;

  var photos = load();
  var cur = 0;

  function load() {
    try {
      var a = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(photos)); } catch (e) {}
  }
  function render() {
    if (count) count.textContent = photos.length + ' 張';
    thumbs.innerHTML = '';
    if (!photos.length) {
      main.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    if (cur >= photos.length) cur = photos.length - 1;
    empty.style.display = 'none';
    main.style.display = 'block';
    main.src = photos[cur];
    photos.forEach(function (src, i) {
      var img = document.createElement('img');
      img.className = 'hbThumb' + (i === cur ? ' on' : '');
      img.src = src;
      img.alt = '';
      img.addEventListener('click', function () { cur = i; render(); });
      thumbs.appendChild(img);
    });
  }

  function compress(f, cb) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 1200;
        var w = im.width, h = im.height;
        if (w > max || h > max) {
          var s = max / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  }

  file.addEventListener('change', function () {
    var fs = Array.prototype.slice.call(file.files || []);
    if (!fs.length) return;
    var done = 0, added = [];
    fs.forEach(function (f) {
      compress(f, function (src) {
        added.push(src);
        done++;
        if (done === fs.length) {
          photos = photos.concat(added);
          save();
          cur = photos.length - 1;
          render();
        }
      });
    });
    file.value = '';
  });

  if (clearBtn) clearBtn.addEventListener('click', function () {
    if (!photos.length) return;
    if (!confirm('確定清空所有手冊照片？')) return;
    photos = []; cur = 0; save(); render();
  });

  render();
})();

/* ── 家長設定：孩子的名字（給寵物叫） ── */
(function () {
  window.__kidInit = 1;
  var note = document.getElementById('hbNote');
  var mask = document.getElementById('kidMask');
  var input = document.getElementById('kidName');
  if (!note || !mask || !input) return;
  function open() {
    input.value = (window.PetSay && window.PetSay.kidName) ? window.PetSay.kidName() : '';
    mask.classList.remove('hidden');
    setTimeout(function () { input.focus(); }, 60);
  }
  function close() { mask.classList.add('hidden'); }
  note.addEventListener('click', open);
  document.getElementById('kidCancel').addEventListener('click', close);
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  document.getElementById('kidSave').addEventListener('click', function () {
    if (window.PetSay) window.PetSay.setKidName(input.value);
    close();
    /* 立刻叫一次，讓家長聽見效果 */
    try {
      var st = 1;
      var raw = localStorage.getItem('dsh_pet');
      if (raw) { var o = JSON.parse(raw); if (o && typeof o.s === 'number') st = o.s; }
      var img = document.querySelector('#farmArea .pet img');
      if (window.PetSay && st > 0) {
        var t = window.PetSay.speak('greet', st, { force: true });
        if (t) {
          if (window.__petCheer) window.__petCheer(t);
          else if (img) window.PetSay.bubble(img, t);
        }
      }
    } catch (e) {}
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('kidSave').click();
  });
})();
</script>
